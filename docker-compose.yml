services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    environment:
      POSTGRES_DB: worldcup
      POSTGRES_USER: worldcup
      POSTGRES_PASSWORD: worldcup
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    configs:
      - source: tempo-config
        target: /etc/tempo/tempo.yaml
    ports:
      - "3200:3200"
    restart: always

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    configs:
      - source: otel-collector-config
        target: /etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    configs:
      - source: grafana-datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana-dashboard-provider
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: spring-ai-dashboard
        target: /var/lib/grafana/dashboards/spring-ai-metrics.json
    depends_on:
      - prometheus
    restart: always

volumes:
  postgres_data:

configs:
  prometheus-config:
    content: |
      global:
        scrape_interval: 15s

      scrape_configs:
        - job_name: worldcup2026
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["host.docker.internal:8080"]

      remote_write:
        - url: ${GRAFANA_CLOUD_PROMETHEUS_URL:-http://localhost:9090/api/v1/write}
          basic_auth:
            username: ${GRAFANA_CLOUD_PROMETHEUS_USERNAME:-}
            password: ${GRAFANA_CLOUD_PROMETHEUS_API_KEY:-}

  otel-collector-config:
    content: |
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
            grpc:
              endpoint: 0.0.0.0:4317

      processors:
        batch:

      exporters:
        otlp:
          endpoint: tempo:4317
          tls:
            insecure: true

      service:
        pipelines:
          traces:
            receivers:
              - otlp
            processors:
              - batch
            exporters:
              - otlp

  tempo-config:
    content: |
      server:
        http_listen_port: 3200

      distributor:
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318

      storage:
        trace:
          backend: local
          local:
            path: /tmp/tempo/traces
          wal:
            path: /tmp/tempo/wal

      metrics_generator:
        registry:
          external_labels:
            source: tempo
            cluster: worldcup
        storage:
          path: /tmp/tempo/generator/wal
          remote_write:
            - url: http://prometheus:9090/api/v1/write

      overrides:
        defaults:
          metrics_generator:
            processors:
              - service-graphs
              - span-metrics

  grafana-datasource:
    content: |
      apiVersion: 1

      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: false

        - name: Tempo
          type: tempo
          uid: tempo
          access: proxy
          url: http://tempo:3200
          editable: false

  grafana-dashboard-provider:
    content: |
      apiVersion: 1

      providers:
        - name: Spring AI
          orgId: 1
          folder: Spring AI
          type: file
          disableDeletion: true
          editable: true
          options:
            path: /var/lib/grafana/dashboards

