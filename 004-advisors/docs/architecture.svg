    </marker>
  </defs>

  <rect fill="#f8fafc" height="560" rx="12" stroke="#cbd5e1" stroke-dasharray="5 5" stroke-width="1.5" width="190" x="30" y="85"/>
  <rect fill="#ffffff" filter="url(#shadow)" height="160" rx="8" stroke="#94a3b8" stroke-width="1" width="170" x="40" y="145"/>
  <rect fill="#eff6ff" height="560" rx="12" stroke="#2563eb" stroke-width="2" width="560" x="250" y="85"/>
  <rect fill="#ffffff" filter="url(#shadow)" height="52" rx="8" stroke="#3b82f6" stroke-width="1.5" width="520" x="270" y="132"/>
  <rect fill="#f0fdf4" height="130" rx="8" stroke="#16a34a" stroke-width="1.5" width="250" x="270" y="196"/>
  <rect fill="#f0fdf4" height="130" rx="8" stroke="#16a34a" stroke-width="1.5" width="250" x="540" y="196"/>
  <rect fill="#fffbeb" height="150" rx="8" stroke="#f59e0b" stroke-width="1.5" width="520" x="270" y="340"/>
  <rect fill="#ffffff" height="55" rx="6" stroke="#fde68a" stroke-width="1.5" width="235" x="285" y="372"/>
  <rect fill="#ffffff" height="55" rx="6" stroke="#fde68a" stroke-width="1.5" width="235" x="540" y="372"/>
  <rect fill="#ffffff" height="40" rx="6" stroke="#fde68a" stroke-width="1" width="490" x="285" y="437"/>
  <rect fill="#ffffff" height="42" rx="6" stroke="#94a3b8" stroke-width="1" width="520" x="270" y="500"/>
  <rect fill="#ffffff" height="72" rx="8" stroke="#94a3b8" stroke-width="1" width="520" x="270" y="558"/>
  <rect fill="#faf5ff" height="300" rx="12" stroke="#9333ea" stroke-width="2" width="340" x="830" y="85"/>
  <rect fill="#fef2f2" height="80" rx="6" stroke="#fca5a5" stroke-width="1" width="290" x="855" y="135"/>
  <rect fill="#f3e8ff" height="55" rx="6" stroke="#d8b4fe" stroke-width="1" width="310" x="845" y="310"/>
  <rect fill="#f8fafc" height="225" rx="10" stroke="#94a3b8" stroke-width="1.5" width="340" x="830" y="405"/>
  <rect fill="#fef2f2" height="65" rx="6" stroke="#fca5a5" stroke-width="1" width="316" x="840" y="552"/>
  <rect fill="#fffbeb" height="55" rx="8" stroke="#f59e0b" stroke-width="1.5" width="1140" x="30" y="675"/>

  <line marker-end="url(#arrow-blue)" stroke="#2563eb" stroke-width="2" x1="845" x2="885" y1="453" y2="453"/>
  <line marker-end="url(#arrow-green)" stroke="#059669" stroke-width="2" x1="845" x2="885" y1="480" y2="480"/>
  <line marker-end="url(#arrow-amber)" stroke="#d97706" stroke-width="2" x1="845" x2="885" y1="507" y2="507"/>
  <line marker-end="url(#arrow-purple)" stroke="#7c3aed" stroke-width="2" x1="845" x2="885" y1="534" y2="534"/>
  <line marker-end="url(#arrow-blue)" stroke="#2563eb" stroke-width="2" x1="210" x2="270" y1="170" y2="170"/>
  <line marker-end="url(#arrow-blue)" stroke="#2563eb" stroke-width="2" x1="270" x2="210" y1="200" y2="200"/>
  <line marker-end="url(#arrow-purple)" stroke="#7c3aed" stroke-width="2" x1="790" x2="830" y1="245" y2="245"/>
  <line marker-end="url(#arrow-purple)" stroke="#7c3aed" stroke-width="2" x1="830" x2="790" y1="272" y2="272"/>
  <path d="M 395,326 L 395,335 L 395,372" fill="none" marker-end="url(#arrow-green)" stroke="#059669" stroke-width="2"/>
  <path d="M 665,326 L 665,335 L 665,372" fill="none" marker-end="url(#arrow-amber)" stroke="#d97706" stroke-width="2"/>

  <rect fill="#ffffff" height="16" rx="3" stroke="#2563eb" stroke-width="1" width="90" x="185" y="153"/>
  <rect fill="#ffffff" height="16" rx="3" stroke="#2563eb" stroke-width="1" width="90" x="185" y="203"/>
  <rect fill="#ffffff" height="16" rx="3" stroke="#059669" stroke-width="1" width="100" x="345" y="332"/>
  <rect fill="#ffffff" height="16" rx="3" stroke="#d97706" stroke-width="1" width="100" x="615" y="332"/>
  <rect fill="#ffffff" height="16" rx="3" stroke="#7c3aed" stroke-width="1" width="65" x="795" y="228"/>
  <rect fill="#ffffff" height="16" rx="3" stroke="#7c3aed" stroke-width="1" width="65" x="795" y="276"/>

  <text fill="#0f172a" font-size="20" font-weight="700" text-anchor="middle" x="600" y="35">Spring AI Advisors API Architecture</text>
  <text fill="#64748b" font-size="13" text-anchor="middle" x="600" y="55">Focused Lesson View: One Advisor, Two Registration Mechanisms, Provable
    Interception Order
  </text>
  <text fill="#334155" font-size="14" font-weight="700" text-anchor="middle" x="125" y="112">Chat Client / HTTP</text>
  <text fill="#64748b" font-size="11" text-anchor="middle" x="125" y="128">curl / REST Client</text>
  <text fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle" x="125" y="170">Client/User</text>
  <text fill="#475569" font-size="10.5" font-style="italic" text-anchor="middle" x="125" y="196">GET /players?name=...</text>
  <text fill="#1e293b" font-size="9.5" font-weight="600" text-anchor="middle" x="125" y="216">"...my email is</text>
  <text fill="#1e293b" font-size="9.5" font-weight="600" text-anchor="middle" x="125" y="230">a@b.com, call 555-1234"</text>
  <text fill="#475569" font-size="10.5" font-style="italic" text-anchor="middle" x="125" y="255">GET /news</text>
  <text fill="#64748b" font-size="9" text-anchor="middle" x="125" y="280">(only 2 endpoints survive</text>
  <text fill="#64748b" font-size="9" text-anchor="middle" x="125" y="293">from the previous module)</text>
  <text fill="#1e40af" font-size="15" font-weight="700" text-anchor="middle" x="530" y="112">Spring AI Application</text>
  <text fill="#1d4ed8" font-size="13" font-weight="700" text-anchor="middle" x="530" y="153">Worldcup2026Controller: /players, /news</text>
  <text fill="#475569" font-size="10" text-anchor="middle" x="530" y="171">Two independent ways to attach the same advisor</text>
  <text fill="#15803d" font-size="11" font-weight="700" text-anchor="middle" x="395" y="216">1. defaultAdvisor (client-wide)</text>
  <text fill="#166534" font-size="9.5" x="280" y="235">piiRedactionAwareChatClient =</text>
  <text fill="#166534" font-size="9.5" x="280" y="250">piiRedactionNotAwareChatClient</text>
  <text fill="#166534" font-size="9.5" x="280" y="265">.mutate().defaultAdvisors(pii)</text>
  <text fill="#047857" font-size="9" font-style="italic" x="280" y="286">Applies to every call this client makes</text>
  <text fill="#047857" font-size="9" font-style="italic" x="280" y="300">— the compliance-policy shape</text>
  <text fill="#4b5563" font-size="9" x="280" y="314">used for /news in this module</text>
  <text fill="#15803d" font-size="11" font-weight="700" text-anchor="middle" x="665" y="216">2. Per-call .advisors(...)</text>
  <text fill="#166534" font-size="9.5" x="550" y="235">piiRedactionNotAwareChatClient</text>
  <text fill="#166534" font-size="9.5" x="550" y="250">.prompt().user(...)</text>
  <text fill="#166534" font-size="9.5" x="550" y="265">.advisors(piiRedactionAdvisor)</text>
  <text fill="#047857" font-size="9" font-style="italic" x="550" y="286">Applies to this one request only</text>
  <text fill="#047857" font-size="9" font-style="italic" x="550" y="300">— the ad-hoc, opt-in shape</text>
  <text fill="#4b5563" font-size="9" x="550" y="314">used for /players in this module</text>
  <text fill="#b45309" font-size="12" font-weight="700" text-anchor="middle" x="530" y="360">Advisor Chain (both lanes converge here, same instance)
  </text>
  <text fill="#92400e" font-size="10.5" font-weight="700" x="295" y="390">PiiRedactionAdvisor</text>
  <text fill="#d97706" font-size="9.5" font-weight="700" text-anchor="end" x="505" y="390">Order 10</text>
  <text fill="#78350f" font-size="9" x="295" y="407">Regex-redacts email/phone in the</text>
  <text fill="#78350f" font-size="9" x="295" y="419">user message before chain.nextCall(...)</text>
  <text fill="#92400e" font-size="10.5" font-weight="700" x="550" y="390">SimpleLoggerAdvisor</text>
  <text fill="#d97706" font-size="9.5" font-weight="700" text-anchor="end" x="760" y="390">Order 30</text>
  <text fill="#78350f" font-size="9" x="550" y="407">Logs the prompt it actually receives —</text>
  <text fill="#78350f" font-size="9" x="550" y="419">already redacted, proving order matters</text>
  <text fill="#92400e" font-size="9.5" font-weight="600" text-anchor="middle" x="530" y="452">ChatClientRequest → advisor.adviseCall(request, chain) mutates prompt</text>
  <text fill="#92400e" font-size="9.5" font-weight="600" text-anchor="middle" x="530" y="468">→ chain.nextCall(mutated) → response flows back as ChatClientResponse</text>
  <text fill="#334155" font-size="10" font-weight="700" text-anchor="middle" x="530" y="516">google-search-retrieval: ON (still on, for now)</text>
  <text fill="#64748b" font-size="9" text-anchor="middle" x="530" y="533">A later module turns this off so tool calling contrasts cleanly</text>
  <text fill="#334155" font-size="11" font-weight="700" text-anchor="middle" x="530" y="578">PiiRedactionAdvisor implements CallAdvisor</text>
  <text fill="#475569" font-size="9.5" x="282" y="596">• Walks every user message in the Prompt</text>
  <text fill="#475569" font-size="9.5" x="282" y="611">• Two regexes: EMAIL → [EMAIL_REDACTED], PHONE → [PHONE_REDACTED]</text>
  <text fill="#64748b" font-size="9" font-style="italic" x="282" y="623">Same instance, wired two different ways — see the two lanes above</text>
  <text fill="#6b21a8" font-size="15" font-weight="700" text-anchor="middle" x="1000" y="112">LLM Model</text>
  <text fill="#dc2626" font-size="10.5" font-weight="700" text-anchor="middle" x="1000" y="155">⚠️ Never sees the raw PII</text>
  <text fill="#991b1b" font-size="9.5" x="865" y="175">The redaction token replaces the email/</text>
  <text fill="#991b1b" font-size="9.5" x="865" y="190">phone number in the prompt to the LLM Model</text>
  <text fill="#991b1b" font-size="9.5" x="865" y="205">actually receives, not just in the log</text>
  <text fill="#581c87" font-size="11" x="850" y="240">• Receives already-redacted prompt</text>
  <text fill="#581c87" font-size="11" x="850" y="262">• Runs live search grounding (still on)</text>
  <text fill="#581c87" font-size="11" x="850" y="284">• Returns structured or plain-text answer</text>
  <text fill="#6b21a8" font-size="10.5" font-weight="700" text-anchor="middle" x="1000" y="330">Same regex, whichever lane called it</text>
  <text fill="#581c87" font-size="9.5" text-anchor="middle" x="1000" y="348">/players (per-call) and /news (default) both</text>
  <text fill="#581c87" font-size="9.5" text-anchor="middle" x="1000" y="360">reach the LLM Model already scrubbed</text>
  <text fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle" x="1000" y="428">Execution Step Legend</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="457">1, 6. Client Request / Response</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="484">2. Default-advisor lane (/news)</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="511">3. Per-call advisor lane (/players)</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="538">4, 5. Redacted Prompt / Model Response</text>
  <text fill="#dc2626" font-size="9.5" font-weight="700" text-anchor="middle" x="1000" y="570">Order matters: 10 before 30</text>
  <text fill="#991b1b" font-size="8.5" text-anchor="middle" x="1000" y="586">PiiRedactionAdvisor must run before</text>
  <text fill="#991b1b" font-size="8.5" text-anchor="middle" x="1000" y="599">SimpleLoggerAdvisor, or the log leaks PII</text>
  <text fill="#2563eb" font-size="8" font-weight="700" text-anchor="middle" x="230" y="165">1. GET /players</text>
  <text fill="#2563eb" font-size="8" font-weight="700" text-anchor="middle" x="230" y="215">6. Final Answer</text>
  <text fill="#059669" font-size="8" font-weight="700" text-anchor="middle" x="395" y="344">2. defaultAdvisors</text>
  <text fill="#d97706" font-size="8" font-weight="700" text-anchor="middle" x="665" y="344">3. .advisors(pii)</text>
  <text fill="#7c3aed" font-size="8" font-weight="700" text-anchor="middle" x="827" y="240">4. Prompt</text>
  <text fill="#7c3aed" font-size="8" font-weight="700" text-anchor="middle" x="827" y="288">5. Answer</text>
  <text fill="#b45309" font-size="12" font-weight="700" text-anchor="middle" x="600" y="698">ADVISORS LESSON: One CallAdvisor, Two Registration Shapes
    — defaultAdvisor for Policy, Per-Call for Opt-In
  </text>
  <text fill="#92400e" font-size="11" text-anchor="middle" x="600" y="716">Order 10 runs before order 30: the log line proves the model was never
    shown the raw email or phone number, whichever lane called the advisor.
  </text>
</svg>
