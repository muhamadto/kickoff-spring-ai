  <path d="M 270,285 L 258,285 L 258,600 L 270,600" fill="none" marker-end="url(#arrow-teal)" stroke="#0d9488" stroke-width="1.5"/>
  <path d="M 790,470 L 812,470 L 812,238 L 830,238" fill="none" marker-end="url(#arrow-purple)" stroke="#7c3aed" stroke-width="1.5"/>

  <rect fill="#ffffff" height="15" rx="3" stroke="#2563eb" stroke-width="1" width="60" x="185" y="131"/>
  <rect fill="#ffffff" height="15" rx="3" stroke="#2563eb" stroke-width="1" width="60" x="185" y="171"/>
  <rect fill="#ffffff" height="15" rx="3" stroke="#059669" stroke-width="1" width="90" x="700" y="196"/>
  <rect fill="#ffffff" height="15" rx="3" stroke="#0d9488" stroke-width="1" width="65" x="30" y="440"/>
  <rect fill="#ffffff" height="15" rx="3" stroke="#059669" stroke-width="1" width="130" x="560" y="558"/>
  <rect fill="#ffffff" height="15" rx="3" stroke="#7c3aed" stroke-width="1" width="90" x="700" y="452"/>

  <text fill="#0f172a" font-size="20" font-weight="700" text-anchor="middle" x="600" y="35">Spring AI Step-Back RAG Architecture</text>
  <text fill="#64748b" font-size="13" text-anchor="middle" x="600" y="55">Focused Lesson View: Two Independent Retrievals, Two Different Prompt
    Slots
  </text>
  <text fill="#334155" font-size="14" font-weight="700" text-anchor="middle" x="125" y="112">Chat Client / HTTP</text>
  <text fill="#64748b" font-size="11" text-anchor="middle" x="125" y="128">curl / REST Client</text>
  <text fill="#1e293b" font-size="12.5" font-weight="700" text-anchor="middle" x="125" y="170">GET /chat</text>
  <text fill="#475569" font-size="9" font-style="italic" text-anchor="middle" x="125" y="192">question="Who scored for</text>
  <text fill="#475569" font-size="9" font-style="italic" text-anchor="middle" x="125" y="204">Morocco vs Haiti?"</text>
  <text fill="#2563eb" font-size="9.5" font-weight="600" text-anchor="middle" x="125" y="224">conversationId="014"</text>
  <text fill="#64748b" font-size="8.5" text-anchor="middle" x="125" y="246">Classification (013-guarded-rag)</text>
  <text fill="#64748b" font-size="8.5" text-anchor="middle" x="125" y="258">already said IN_SCOPE</text>
  <text fill="#94a3b8" font-size="8.5" font-style="italic" text-anchor="middle" x="125" y="280">This module only changes</text>
  <text fill="#94a3b8" font-size="8.5" font-style="italic" text-anchor="middle" x="125" y="292">what happens next</text>
  <text fill="#1e40af" font-size="15" font-weight="700" text-anchor="middle" x="530" y="112">Spring AI Application (Java)</text>
  <text fill="#1d4ed8" font-size="11.5" font-weight="700" text-anchor="middle" x="530" y="150">Worldcup2026Service.respondInScope(question,
    conversationId)
  </text>
  <text fill="#475569" font-size="9" text-anchor="middle" x="530" y="166">Classification gate (013-guarded-rag) already returned IN_SCOPE — not shown
    here
  </text>
  <text fill="#15803d" font-size="10.5" font-weight="700" text-anchor="middle" x="530" y="200">Step 1 —
    StepBackQueryService.generateStepBackQuery(question)
  </text>
  <text fill="#166534" font-size="9" text-anchor="middle" x="530" y="216">stepBackChatClient: flash model, bare, no advisors</text>
  <text fill="#047857" font-size="8.5" font-style="italic" text-anchor="middle" x="530" y="232">"Who scored for Morocco vs Haiti?" → "What were
    Morocco's group stage results?"
  </text>
  <text fill="#0f766e" font-size="10.5" font-weight="700" text-anchor="middle" x="530" y="272">Step 2 — StepBackSearchService.search(stepBackQuery)
  </text>
  <text fill="#115e59" font-size="9" text-anchor="middle" x="530" y="288">Same dense vector technique as QuestionAnswerAdvisor, but a standalone
    class
  </text>
  <text fill="#0d9488" font-size="8.5" font-style="italic" text-anchor="middle" x="530" y="304">Queries world_cup_knowledge directly, returns Optional&lt;String&gt;
    stepBackContext
  </text>
  <text fill="#b45309" font-size="10.5" font-weight="700" text-anchor="middle" x="530" y="344">Step 3 — Assemble the prompt: two sources, two slots
  </text>
  <text fill="#92400e" font-size="9" text-anchor="middle" x="530" y="360">.system(stepBackContext) + .user(question) — QuestionAnswerAdvisor only ever
    reads the second
  </text>
  <text fill="#7e22ce" font-size="11" font-weight="700" text-anchor="middle" x="530" y="402">Step 4 — mainChatClient.call() (now the pro model)</text>
  <text fill="#14532d" font-size="10" font-weight="700" x="295" y="434">QuestionAnswerAdvisor</text>
  <text fill="#15803d" font-size="9" font-weight="700" text-anchor="end" x="765" y="434">Order 25</text>
  <text fill="#166534" font-size="8.5" x="295" y="452">Retrieves against .user(question) only — completely</text>
  <text fill="#166534" font-size="8.5" x="295" y="466">unaware Step 2's broader retrieval ever happened</text>
  <text fill="#047857" font-size="8" font-style="italic" x="295" y="480">Byte-for-byte identical to 013-guarded-rag's own copy</text>
  <text fill="#4b5563" font-size="9" font-weight="600" text-anchor="middle" x="530" y="513">PiiRedactionAdvisor (10), MessageChatMemoryAdvisor (20),
    SimpleLoggerAdvisor (30)
  </text>
  <text fill="#94a3b8" font-size="8" font-style="italic" text-anchor="middle" x="530" y="527">unchanged since earlier modules — not this lesson's
    point
  </text>
  <text fill="#0f766e" font-size="10.5" font-weight="700" text-anchor="middle" x="530" y="590">world_cup_knowledge (PGVector) — queried twice,
    independently, per request
  </text>
  <text fill="#115e59" font-size="8.5" text-anchor="middle" x="530" y="606">Step 2's call and QuestionAnswerAdvisor's call never share code or know
    about each other
  </text>
  <text fill="#6b21a8" font-size="15" font-weight="700" text-anchor="middle" x="1000" y="112">LLM Model</text>
  <text fill="#15803d" font-size="10.5" font-weight="700" text-anchor="middle" x="1000" y="148">stepBackChatClient</text>
  <text fill="#166534" font-size="9" text-anchor="middle" x="1000" y="164">Flash model, bare — one narrow rewrite call</text>
  <text fill="#166534" font-size="8.5" font-style="italic" text-anchor="middle" x="1000" y="180">Never touches memory or the vector store</text>
  <text fill="#6b21a8" font-size="10.5" font-weight="700" text-anchor="middle" x="1000" y="222">mainChatClient</text>
  <text fill="#581c87" font-size="9" text-anchor="middle" x="1000" y="238">Pro model now — 013-guarded-rag used flash</text>
  <text fill="#581c87" font-size="9" text-anchor="middle" x="1000" y="254">Sees both context sources, different slots</text>
  <text fill="#581c87" font-size="8.5" font-style="italic" text-anchor="middle" x="1000" y="270">QuestionAnswerAdvisor attached, order 25</text>
  <text fill="#dc2626" font-size="10" font-weight="700" text-anchor="middle" x="1000" y="314">⚠️ Augments, never replaces</text>
  <text fill="#991b1b" font-size="8.5" text-anchor="middle" x="1000" y="330">QuestionAnswerAdvisor still retrieves against</text>
  <text fill="#991b1b" font-size="8.5" text-anchor="middle" x="1000" y="344">the fan's exact words — completely unaware</text>
  <text fill="#991b1b" font-size="8.5" text-anchor="middle" x="1000" y="358">the step-back pass exists at all</text>
  <text fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle" x="1000" y="420">Execution Step Legend</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="449">1, 6. Client Request / Response</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="474">2. Step-back rewrite call</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="499">3. Standalone dense search (Step 2)</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="524">4. Generation call (mainChatClient)</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="549">5. QuestionAnswerAdvisor's own search</text>
  <text fill="#b45309" font-size="9.5" font-weight="700" text-anchor="middle" x="1000" y="583">Two Retrievals, Two Prompt Slots</text>
  <text fill="#92400e" font-size="8.5" text-anchor="middle" x="1000" y="599">System message carries the broad step-back</text>
  <text fill="#92400e" font-size="8.5" text-anchor="middle" x="1000" y="612">context; user message stays untouched for QA</text>
  <text fill="#2563eb" font-size="7.5" font-weight="700" text-anchor="middle" x="215" y="142">1. /chat</text>
  <text fill="#2563eb" font-size="7.5" font-weight="700" text-anchor="middle" x="215" y="182">6. Answer</text>
  <text fill="#059669" font-size="7.5" font-weight="700" text-anchor="middle" x="745" y="207">2. rewrite()</text>
  <text fill="#0d9488" font-size="7.5" font-weight="700" text-anchor="middle" x="62" y="451">3. search()</text>
  <text fill="#059669" font-size="7.5" font-weight="700" text-anchor="middle" x="625" y="569">5. own search()</text>
  <text fill="#7c3aed" font-size="7.5" font-weight="700" text-anchor="middle" x="745" y="463">4. generate()</text>
  <text fill="#b45309" font-size="12" font-weight="700" text-anchor="middle" x="600" y="698">STEP-BACK LESSON: Retrieval on the Broad Question
    Augments, It Never Replaces, Retrieval on the Exact Question
  </text>
  <text fill="#92400e" font-size="11" text-anchor="middle" x="600" y="716">QuestionAnswerAdvisor and StepBackSearchService run the same dense-search
    technique against two different queries, in two different prompt slots, each unaware of the other.
  </text>
</svg>