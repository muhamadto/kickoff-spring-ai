  <rect fill="#f0fdf9" height="58" rx="8" stroke="#0d9488" stroke-width="1.5" width="520" x="270" y="572"/>
  <rect fill="#faf5ff" height="300" rx="12" stroke="#9333ea" stroke-width="2" width="340" x="830" y="85"/>
  <rect fill="#dcfce7" height="64" rx="6" stroke="#4ade80" stroke-width="1.5" width="300" x="850" y="130"/>
  <rect fill="#f3e8ff" height="80" rx="6" stroke="#d8b4fe" stroke-width="1.5" width="300" x="850" y="204"/>
  <rect fill="#fef2f2" height="68" rx="6" stroke="#fca5a5" stroke-width="1" width="300" x="850" y="296"/>
  <rect fill="#f8fafc" height="248" rx="10" stroke="#94a3b8" stroke-width="1.5" width="340" x="830" y="397"/>
