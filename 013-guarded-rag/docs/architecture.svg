  <rect fill="#fef3c7" height="22" rx="4" stroke="#b45309" stroke-width="1" width="115" x="740" y="145"/>

  <text fill="#0f172a" font-size="20" font-weight="700" text-anchor="middle" x="600" y="30">Spring AI Guarded RAG Architecture</text>
  <text fill="#475569" font-size="13" text-anchor="middle" x="600" y="50">Deterministic Security &amp; Logic Gates with Fast Deflection Before
    Generation
  </text>
  <text fill="#334155" font-size="14" font-weight="700" text-anchor="middle" x="107" y="95">Chat Client / HTTP</text>
  <text fill="#64748b" font-size="11" text-anchor="middle" x="107" y="112">REST Controller</text>
  <text fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle" x="107" y="160">Client / User</text>
  <text fill="#2563eb" font-size="11" font-style="italic" text-anchor="middle" x="107" y="182">GET /chat</text>
  <text fill="#1e293b" font-size="9.5" font-weight="600" text-anchor="middle" x="107" y="202">?question="..."</text>
  <text fill="#1e293b" font-size="9.5" font-weight="600" text-anchor="middle" x="107" y="220">&amp;conversationId="s-123"</text>
  <text fill="#0369a1" font-size="15" font-weight="700" text-anchor="middle" x="502" y="95">Spring AI Application (Worldcup2026Service)</text>
  <text fill="#0c4a6e" font-size="12" font-weight="700" text-anchor="middle" x="502" y="133">Worldcup2026Service.chat(question, conversationId)</text>
  <text fill="#0369a1" font-size="9.5" text-anchor="middle" x="502" y="148">Java Pattern Match Switch over MessageClassification Outcome</text>
  <text fill="#92400e" font-size="11.5" font-weight="700" x="232" y="191">Gate 1: MessageClassificationService (Single LLM Call)</text>
  <text fill="#d97706" font-size="9" font-weight="700" text-anchor="end" x="773" y="191">classificationChatClient (Lightweight Model)</text>
  <text fill="#78350f" font-size="9.5" x="232" y="204">• Sorts message into 1 of 5 buckets: BOOKING_REQUEST, IN_SCOPE,</text>
  <text fill="#78350f" font-size="9.5" x="232" y="217">RELATED_BUT_OUT_OF_SCOPE, NOT_RELATED, PROBABLE_SECURITY_PROBLEM</text>
  <text fill="#b45309" font-size="9.5" font-weight="600" x="232" y="233">• Fails Closed: Unparseable responses default to NOT_RELATED (Bypasses LLM generation)</text>
  <text fill="#991b1b" font-size="11" font-weight="700" text-anchor="middle" x="300" y="282">Fast Deflection</text>
  <text fill="#7f1d1d" font-size="8.5" text-anchor="middle" x="300" y="296">(No RAG / No Booking)</text>
  <text fill="#dc2626" font-size="9" font-weight="700" x="234" y="323">PROBABLE_SECURITY</text>
  <text fill="#991b1b" font-size="8" x="234" y="338">Prompt Injection Blocked</text>
  <text fill="#dc2626" font-size="9" font-weight="700" x="234" y="373">OUT_OF_SCOPE</text>
  <text fill="#991b1b" font-size="8" x="234" y="388">e.g. Weather / Medical Advice</text>
  <text fill="#dc2626" font-size="9" font-weight="700" x="234" y="423">NOT_RELATED</text>
  <text fill="#991b1b" font-size="8" x="234" y="438">Non-WorldCup Topic / Default</text>
  <text fill="#991b1b" font-size="8.5" font-weight="700" text-anchor="middle" x="300" y="472">Returns Fixed Strings Directly</text>
  <text fill="#166534" font-size="11" font-weight="700" text-anchor="middle" x="487" y="282">BOOKING_REQUEST Path</text>
  <text fill="#15803d" font-size="8.5" text-anchor="middle" x="487" y="296">Deterministic Plain Java Pipeline</text>
  <text fill="#14532d" font-size="9.5" font-weight="700" x="406" y="323">1. Structured Extraction</text>
  <text fill="#166534" font-size="8" x="406" y="337">• .entity(BookingRequest.class)</text>
  <text fill="#166534" font-size="8" x="406" y="350">• Extracts: teams, date, quantity</text>
  <text fill="#854d0e" font-size="8" x="406" y="362">• Null if missing (No guessing)</text>
  <text fill="#14532d" font-size="9.5" font-weight="700" x="406" y="393">2. Required Fields Check</text>
  <text fill="#166534" font-size="8" x="406" y="407">• If any field is null -&gt; Refuse</text>
  <text fill="#166534" font-size="8" x="406" y="420">• Asks user for missing data</text>
  <text fill="#14532d" font-size="9.5" font-weight="700" x="406" y="455">3. Fixture Validity Check</text>
  <text fill="#15803d" font-size="8" x="406" y="469">• FixtureRegistryService</text>
  <text fill="#15803d" font-size="8" x="406" y="482">• Validates known group stage</text>
  <text fill="#dc2626" font-size="8.5" font-weight="700" x="406" y="495">• Refuses non-existent matches</text>
  <text fill="#14532d" font-size="9.5" font-weight="700" x="406" y="530">4. Duplicate Check</text>
  <text fill="#166534" font-size="8" x="406" y="544">• BookingService tracks state</text>
  <text fill="#166534" font-size="8" x="406" y="557">• Checks conversationId history</text>
  <text fill="#166534" font-size="8" x="406" y="569">• Blocks duplicate bookings</text>
  <text fill="#14532d" font-size="10" font-weight="800" x="406" y="602">5. Issue Booking Ref</text>
  <text fill="#15803d" font-size="8.5" font-weight="700" x="406" y="617">• Generates "WC26-XXXX"</text>
  <text fill="#166534" font-size="8" x="406" y="630">• Confirms ticket reservation</text>
  <text fill="#6b21a8" font-size="11" font-weight="700" text-anchor="middle" x="690" y="282">IN_SCOPE Path</text>
  <text fill="#7e22ce" font-size="8.5" text-anchor="middle" x="690" y="296">mainChatClient Advisor Pipeline</text>
  <text fill="#581c87" font-size="9" font-weight="700" x="610" y="323">PiiRedactionAdvisor</text>
  <text fill="#7e22ce" font-size="8" font-weight="700" text-anchor="end" x="771" y="323">Order 10</text>
  <text fill="#6b21a8" font-size="8" x="610" y="338">• Redacts personal info</text>
  <text fill="#581c87" font-size="9" font-weight="700" x="610" y="379">MessageChatMemoryAdvisor</text>
  <text fill="#7e22ce" font-size="8" font-weight="700" text-anchor="end" x="771" y="379">Order 20</text>
  <text fill="#6b21a8" font-size="8" x="610" y="394">• Reads/Writes session memory</text>
  <text fill="#6b21a8" font-size="8" x="610" y="407">• Keyed by conversationId</text>
  <text fill="#581c87" font-size="9" font-weight="700" x="610" y="445">QuestionAnswerAdvisor</text>
  <text fill="#7e22ce" font-size="8" font-weight="700" text-anchor="end" x="771" y="445">Order 25</text>
  <text fill="#6b21a8" font-size="8" font-weight="700" x="610" y="460">• Fixed Similarity Vector RAG</text>
  <text fill="#6b21a8" font-size="8" x="610" y="473">• Vector Store search on KB</text>
  <text fill="#6b21a8" font-size="8" x="610" y="486">• Injects context into prompt</text>
  <text fill="#581c87" font-size="9" font-weight="700" x="610" y="518">SimpleLoggerAdvisor</text>
  <text fill="#7e22ce" font-size="8" font-weight="700" text-anchor="end" x="771" y="518">Order 30</text>
  <text fill="#6b21a8" font-size="8" x="610" y="533">• Logs framework prompts</text>
  <text fill="#3b0764" font-size="9.5" font-weight="800" x="610" y="578">Main LLM Generation</text>
  <text fill="#581c87" font-size="8" x="610" y="593">• Grounded Q&amp;A response</text>
  <text fill="#581c87" font-size="8" x="610" y="606">• Uses retrieved tournament facts</text>
  <text fill="#581c87" font-size="8" x="610" y="619">• Synthesizes clean answer</text>
  <text fill="#6b21a8" font-size="15" font-weight="700" text-anchor="middle" x="997" y="95">LLM Model Provider</text>
  <text fill="#6b21a8" font-size="11" font-weight="700" x="845" y="135">classificationChatClient (Bare Bean)</text>
  <text fill="#a855f7" font-size="8.5" font-weight="700" text-anchor="end" x="1150" y="135">Lightweight Model</text>
  <text fill="#581c87" font-size="8.5" x="845" y="152">• NO Advisors (No PII, No Memory, No Logging)</text>
  <text fill="#581c87" font-size="8.5" x="845" y="166">• Isolated lightweight calls to keep latency low</text>
  <text fill="#7e22ce" font-size="8.5" font-weight="700" x="845" y="182">Used for:</text>
  <text fill="#6b21a8" font-size="8" x="845" y="196">1) classify(question) 2) extract BookingRequest.class</text>
  <text fill="#6b21a8" font-size="11" font-weight="700" x="845" y="260">mainChatClient LLM Model</text>
  <text fill="#581c87" font-size="8.5" x="845" y="280">• Executed ONLY when message is IN_SCOPE</text>
  <text fill="#581c87" font-size="8.5" x="845" y="296">• Enriched with Chat Memory + Vector RAG Context</text>
  <text fill="#701a75" font-size="14" font-weight="700" text-anchor="middle" x="997" y="410">Database Layer</text>
  <text fill="#86198f" font-size="10.5" font-weight="700" x="845" y="443">Vector Store</text>
  <text fill="#701a75" font-size="8.5" x="845" y="458">• Stores World Cup 2026 document embeddings</text>
  <text fill="#701a75" font-size="8.5" x="845" y="472">• Queried by QuestionAnswerAdvisor (Order 25)</text>
  <text fill="#86198f" font-size="10.5" font-weight="700" x="845" y="518">JDBC Chat Memory Table</text>
  <text fill="#701a75" font-size="8.5" x="845" y="533">• Multi-turn history keyed by conversationId</text>
  <text fill="#701a75" font-size="8.5" x="845" y="547">• Updated ONLY for IN_SCOPE conversations</text>
  <text fill="#701a75" font-size="10.5" font-weight="800" x="845" y="593">ChatHistoryRepository (Audit Log)</text>
  <text fill="#a21caf" font-size="8.5" font-weight="700" x="845" y="610">• Records outcome of ALL 5 classification branches</text>
  <text fill="#701a75" font-size="8" x="845" y="625">• Captures Fast Deflection responses (Security, Scope, Not Related)</text>
  <text fill="#701a75" font-size="8" x="845" y="638">• Captures booking confirmations &amp; errors</text>
  <text fill="#701a75" font-size="8" x="845" y="651">• Captures grounded RAG responses</text>
  <text fill="#a21caf" font-size="8" font-weight="700" x="845" y="668">Full visibility regardless of generation execution</text>
  <text fill="#78350f" font-size="9" font-weight="800" text-anchor="middle" x="797" y="160">1 Call (Scope + Intent)</text>
  <text fill="#059669" font-size="7.5" font-weight="700" x="730" y="330">Structured Entity Extraction</text>
  <text fill="#991b1b" font-size="13" font-weight="800" text-anchor="middle" x="600" y="748">KEY ARCHITECTURAL SHIFT: Agentic RAG vs. Guarded RAG
  </text>
  <text fill="#dc2626" font-size="10" font-weight="700" x="50" y="777">Agentic RAG (Model-Centric Decisions):</text>
  <text fill="#991b1b" font-size="9" x="50" y="793">• Model directly owned the tool execution decision via BookingTool.</text>
  <text fill="#991b1b" font-size="9" x="50" y="807">• Risks: Model booked when fan was musing, hallucinated non-existent fixtures,</text>
  <text fill="#991b1b" font-size="9" x="50" y="821">recorded duplicate bookings, or allowed prompt manipulation.</text>
  <text fill="#166534" font-size="10" font-weight="700" x="620" y="777">Guarded RAG (Deterministic Fast Deflection &amp; Java Guardrails):</text>
  <text fill="#14532d" font-size="9" x="620" y="793">• Single classification call fast-deflects security threats &amp; out-of-scope queries
    instantly.
  </text>
  <text fill="#14532d" font-size="9" x="620" y="807">• Plain Java validates required fields, fixture existence in group stage registry,</text>
  <text fill="#14532d" font-size="9" x="620" y="821">and duplicate prevention BEFORE any booking or RAG synthesis occurs.</text>
</svg>
