<svg style="background-color: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;" height="100%"
  viewBox="0 0 1380 780" width="100%"
  xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter height="110%" id="shadow" width="110%" x="-5%" y="-5%">
      <feDropShadow dx="0" dy="2" flood-color="#000000" flood-opacity="0.08" stdDeviation="4"/>
    </filter>
    <marker id="arrow-purple" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arrow-amber" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-blue" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title Area -->
  <text fill="#0f172a" font-size="24" font-weight="700" text-anchor="middle" x="690" y="45">Spring AI Observability &amp; Telemetry Architecture</text>
  <text fill="#64748b" font-size="14" text-anchor="middle" x="690" y="70">Unified View: Chat Client Requests, Application Metrics, Distributed Tracing, and Dashboards</text>

  <!-- Background Zones -->
  <!-- Client Zone -->
  <rect fill="#f8fafc" height="560" rx="12" stroke="#cbd5e1" stroke-dasharray="5 5" stroke-width="1.5" width="240" x="20" y="100"/>
  <text fill="#64748b" font-size="14" font-weight="700" text-anchor="middle" x="140" y="125">User / Client</text>

  <!-- Application Zone -->
  <rect fill="#f8fafc" height="560" rx="12" stroke="#cbd5e1" stroke-dasharray="5 5" stroke-width="1.5" width="340" x="280" y="100"/>
  <text fill="#64748b" font-size="14" font-weight="700" text-anchor="middle" x="450" y="125">Spring Boot Application</text>

  <!-- Telemetry Zone -->
  <rect fill="#f8fafc" height="560" rx="12" stroke="#cbd5e1" stroke-dasharray="5 5" stroke-width="1.5" width="340" x="640" y="100"/>
  <text fill="#64748b" font-size="14" font-weight="700" text-anchor="middle" x="810" y="125">Telemetry Pipeline</text>

  <!-- Grafana Zone -->
  <rect fill="#f8fafc" height="560" rx="12" stroke="#cbd5e1" stroke-dasharray="5 5" stroke-width="1.5" width="340" x="1000" y="100"/>
  <text fill="#64748b" font-size="14" font-weight="700" text-anchor="middle" x="1170" y="125">Visualization</text>

  <!-- ==================== CONNECTING LINES ==================== -->
  <!-- Client to App -->
  <path d="M 230 240 L 290 240" fill="none" marker-end="url(#arrow-blue)" stroke="#2563eb" stroke-width="2"/>
  <text fill="#1d4ed8" font-size="11" font-weight="600" text-anchor="middle" x="260" y="232">HTTP</text>

  <!-- App to Prometheus -->
  <path d="M 600 230 L 660 230" fill="none" marker-end="url(#arrow-red)" stroke="#dc2626" stroke-width="2"/>
  <text fill="#b91c1c" font-size="11" font-weight="600" text-anchor="middle" x="630" y="222">Scrape</text>

  <!-- App to OTel Collector -->
  <path d="M 600 480 L 660 480" fill="none" marker-end="url(#arrow-purple)" stroke="#9333ea" stroke-width="2"/>
  <text fill="#7e22ce" font-size="11" font-weight="600" text-anchor="middle" x="630" y="472">OTLP</text>

  <!-- OTel Collector to Tempo -->
  <path d="M 810 520 L 810 550 L 870 550" fill="none" marker-end="url(#arrow-purple)" stroke="#9333ea" stroke-width="2"/>
  
  <!-- Grafana to Data Sources -->
  <path d="M 960 250 L 1020 250" fill="none" marker-end="url(#arrow-amber)" stroke="#d97706" stroke-width="2"/>
  <text fill="#b45309" font-size="11" font-weight="600" text-anchor="middle" x="990" y="242">Ingest</text>

  <path d="M 960 550 L 980 550 L 980 320 L 1020 320" fill="none" marker-end="url(#arrow-amber)" stroke="#d97706" stroke-width="2"/>
  <text fill="#b45309" font-size="11" font-weight="600" text-anchor="middle" x="1000" y="310">Ingest</text>


  <!-- ==================== CLIENT ZONE ==================== -->
  <rect fill="#ffffff" filter="url(#shadow)" height="490" rx="8" stroke="#94a3b8" stroke-width="1.5" width="200" x="40" y="150"/>
  <rect fill="#eff6ff" height="40" rx="6" width="200" x="40" y="150"/>
  <text fill="#1e293b" font-size="15" font-weight="700" text-anchor="middle" x="140" y="175">Chat Client / HTTP</text>
  <text fill="#64748b" font-size="12" text-anchor="middle" x="140" y="210">curl / REST Client</text>
  
  <text fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle" x="140" y="250">Same three questions,</text>
  <text fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle" x="140" y="265">Guarded RAG architecture</text>
  
  <!-- Question A -->
  <rect fill="#f8fafc" height="44" rx="4" stroke="#e2e8f0" width="170" x="55" y="285"/>
  <text fill="#475569" font-size="11" font-style="italic" text-anchor="middle" x="140" y="303">"Who was Man of the Match</text>
  <text fill="#475569" font-size="11" font-style="italic" text-anchor="middle" x="140" y="318">in Uzbekistan vs Colombia?"</text>

  <!-- Question B -->
  <rect fill="#f8fafc" height="44" rx="4" stroke="#e2e8f0" width="170" x="55" y="340"/>
  <text fill="#475569" font-size="11" font-style="italic" text-anchor="middle" x="140" y="358">"Book 2 tickets for</text>
  <text fill="#475569" font-size="11" font-style="italic" text-anchor="middle" x="140" y="373">Morocco vs Haiti..."</text>

  <!-- Question C -->
  <rect fill="#f8fafc" height="44" rx="4" stroke="#e2e8f0" width="170" x="55" y="395"/>
  <text fill="#475569" font-size="11" font-style="italic" text-anchor="middle" x="140" y="413">"What's the best</text>
  <text fill="#475569" font-size="11" font-style="italic" text-anchor="middle" x="140" y="428">pizza topping?"</text>

  <rect fill="#eff6ff" height="85" rx="6" stroke="#bfdbfe" width="180" x="50" y="460"/>
  <text fill="#334155" font-size="10.5" text-anchor="middle" x="140" y="478">No route changed. What's new</text>
  <text fill="#334155" font-size="10.5" text-anchor="middle" x="140" y="492">is what you can now SEE</text>
  <text fill="#2563eb" font-size="11" font-weight="700" text-anchor="middle" x="140" y="512">conversationId="123"</text>
  <text fill="#64748b" font-size="10" text-anchor="middle" x="140" y="530">/chat and /chat/{id} unchanged</text>


  <!-- ==================== APPLICATION ZONE ==================== -->
  <rect fill="#ffffff" filter="url(#shadow)" height="490" rx="8" stroke="#3b82f6" stroke-width="1.5" width="300" x="300" y="150"/>
  <rect fill="#bfdbfe" height="40" rx="6" width="300" x="300" y="150"/>
  <text fill="#1e3a8a" font-size="15" font-weight="700" text-anchor="middle" x="450" y="175">Spring Boot App &amp; AI Client</text>

  <!-- Actuator Box -->
  <rect fill="#f0fdf4" height="210" rx="6" stroke="#4ade80" stroke-width="1.5" width="270" x="315" y="210"/>
  <text fill="#166534" font-size="14" font-weight="700" x="330" y="235">Spring Boot Actuator</text>
  <text fill="#166534" font-size="10" font-weight="600" x="330" y="250">(/actuator/prometheus)</text>
  
  <text fill="#334155" font-size="11" font-weight="700" x="330" y="275">What it does:</text>
  <text fill="#475569" font-size="11" x="405" y="275">Provides operational information</text>
  <text fill="#475569" font-size="11" x="330" y="290">and monitoring features for your app</text>
  
  <text fill="#334155" font-size="11" font-weight="700" x="330" y="315">Key features:</text>
  <text fill="#475569" font-size="10" x="330" y="335">• Serves status checks and runtime</text>
  <text fill="#475569" font-size="10" x="340" y="350">data via dedicated web endpoints</text>
  <text fill="#475569" font-size="10" x="330" y="370">• Offers detailed metrics on memory,</text>
  <text fill="#475569" font-size="10" x="340" y="385">threads, and application activity</text>
  <text fill="#475569" font-size="10" x="330" y="405">• Enables verification of application</text>
  <text fill="#475569" font-size="10" x="340" y="420">availability and basic health</text>

  <!-- OTel Box -->
  <rect fill="#faf5ff" height="110" rx="6" stroke="#c084fc" stroke-width="1.5" width="270" x="315" y="440"/>
  <text fill="#6b21a8" font-size="14" font-weight="700" x="330" y="465">OpenTelemetry Tracing</text>
  
  <text fill="#334155" font-size="11" font-weight="700" x="330" y="490">What it does:</text>
  <text fill="#475569" font-size="11" x="405" y="490">Instruments Spring AI</text>
  
  <text fill="#475569" font-size="10" x="330" y="510">• Auto-captures Advisor/Model spans</text>
  <text fill="#475569" font-size="10" x="330" y="525">• Exports OTLP format to local collector</text>
  <text fill="#475569" font-size="10" x="330" y="540">• Zero code changes needed</text>


  <!-- ==================== TELEMETRY ZONE ==================== -->
  
  <!-- Prometheus Box -->
  <rect fill="#ffffff" filter="url(#shadow)" height="220" rx="8" stroke="#f87171" stroke-width="1.5" width="300" x="660" y="150"/>
  <rect fill="#fecaca" height="40" rx="6" width="300" x="660" y="150"/>
  <text fill="#991b1b" font-size="15" font-weight="700" text-anchor="middle" x="810" y="175">Prometheus</text>

  <text fill="#334155" font-size="11" font-weight="700" x="675" y="215">What it does:</text>
  <text fill="#475569" font-size="11" x="750" y="215">Gathers and archives application</text>
  <text fill="#475569" font-size="11" x="675" y="230">metrics, organizing them as time-series data</text>
  
  <text fill="#334155" font-size="11" font-weight="700" x="675" y="260">Key features:</text>
  <text fill="#475569" font-size="10" x="675" y="280">• Periodically pulls metrics data from</text>
  <text fill="#475569" font-size="10" x="685" y="295">the Spring Boot Actuator endpoint</text>
  <text fill="#475569" font-size="10" x="675" y="315">• Efficiently stores high-cardinality data</text>
  <text fill="#475569" font-size="10" x="675" y="335">• Offers powerful query language (PromQL)</text>
  <text fill="#475569" font-size="10" x="675" y="355">• Features comprehensive alerting capabilities</text>

  <!-- OTel Collector & Tempo -->
  <rect fill="#ffffff" filter="url(#shadow)" height="250" rx="8" stroke="#c084fc" stroke-width="1.5" width="300" x="660" y="390"/>
  <rect fill="#e9d5ff" height="40" rx="6" width="300" x="660" y="390"/>
  <text fill="#6b21a8" font-size="15" font-weight="700" text-anchor="middle" x="810" y="415">Distributed Tracing</text>

  <!-- Sub box: OTel Collector -->
  <rect fill="#faf5ff" height="55" rx="6" stroke="#d8b4fe" width="270" x="675" y="445"/>
  <text fill="#7e22ce" font-size="12" font-weight="700" x="685" y="465">OTel Collector</text>
  <text fill="#475569" font-size="10" x="685" y="485">Receives OTLP (4318), batches &amp; forwards to Tempo</text>

  <!-- Sub box: Tempo -->
  <rect fill="#fdf4ff" height="115" rx="6" stroke="#e879f9" width="270" x="675" y="510"/>
  <text fill="#a21caf" font-size="12" font-weight="700" x="685" y="530">Grafana Tempo</text>
  
  <text fill="#334155" font-size="11" font-weight="700" x="685" y="555">What it does:</text>
  <text fill="#475569" font-size="11" x="760" y="555">Tracing Backend</text>
  <text fill="#475569" font-size="10" x="685" y="575">• Stores distributed traces on local disk</text>
  <text fill="#475569" font-size="10" x="685" y="590">• Correlates trace IDs across components</text>
  <text fill="#475569" font-size="10" x="685" y="605">• Exposes TraceQL for Grafana queries</text>


  <!-- ==================== VISUALIZATION ZONE ==================== -->
  
  <!-- Grafana Box -->
  <rect fill="#ffffff" filter="url(#shadow)" height="490" rx="8" stroke="#fbbf24" stroke-width="1.5" width="300" x="1020" y="150"/>
  <rect fill="#fde68a" height="40" rx="6" width="300" x="1020" y="150"/>
  <text fill="#b45309" font-size="15" font-weight="700" text-anchor="middle" x="1170" y="175">Grafana</text>

  <text fill="#334155" font-size="11" font-weight="700" x="1040" y="215">What it does:</text>
  <text fill="#475569" font-size="11" x="1115" y="215">Displays and interprets metrics</text>
  <text fill="#475569" font-size="11" x="1040" y="230">data, presenting it in intuitive dashboards</text>
  
  <text fill="#334155" font-size="11" font-weight="700" x="1040" y="260">Key features:</text>
  <text fill="#475569" font-size="10" x="1040" y="280">• Builds flexible dashboards using graphs,</text>
  <text fill="#475569" font-size="10" x="1050" y="295">charts, maps, and annotations</text>
  <text fill="#475569" font-size="10" x="1040" y="315">• Integrates with Prometheus and Tempo</text>
  <text fill="#475569" font-size="10" x="1040" y="335">• Enables dynamic and interactive views</text>
  <text fill="#475569" font-size="10" x="1050" y="350">through templating and alerts</text>
  <text fill="#475569" font-size="10" x="1040" y="370">• Offers threshold-based alerting directly</text>

  <!-- Spring AI Dashboard Focus -->
  <rect fill="#fffbeb" height="190" rx="6" stroke="#fcd34d" width="270" x="1035" y="415"/>
  <text fill="#92400e" font-size="12" font-weight="700" x="1050" y="440">Spring AI Analytics Dashboard</text>
  
  <text fill="#475569" font-size="10" font-weight="600" x="1050" y="465">Metrics View (Prometheus):</text>
  <text fill="#475569" font-size="10" x="1060" y="480">- Total Token Usage &amp; Cost Rate</text>
  <text fill="#475569" font-size="10" x="1060" y="495">- Request counts &amp; aggregate latencies</text>

  <text fill="#475569" font-size="10" font-weight="600" x="1050" y="525">Traces View (Tempo):</text>
  <text fill="#475569" font-size="10" x="1060" y="540">- Waterfall view of LLM generation</text>
  <text fill="#475569" font-size="10" x="1060" y="555">- Specific step-back / RAG advisor hops</text>
  <text fill="#475569" font-size="10" x="1060" y="570">- Inspect specific refusal vs booking shapes</text>
  <text fill="#b45309" font-size="10" font-weight="700" font-style="italic" x="1050" y="590">(Seamlessly linked via Trace ID)</text>


  <!-- ==================== FOOTER LESSON ==================== -->
  <rect fill="#fffbeb" height="70" rx="8" stroke="#f59e0b" stroke-width="1.5" width="1340" x="20" y="685"/>
  <text fill="#b45309" font-size="14" font-weight="700" text-anchor="middle" x="690" y="715">HOW IT ALL HANGS TOGETHER: THE OBSERVABILITY LIFECYCLE</text>
  <text fill="#92400e" font-size="12" text-anchor="middle" x="690" y="735">
    The Client sends a prompt. Spring AI executes it while Actuator exposes macro-level counts (costs/duration) and OTel exports micro-level spans (exact steps taken).
  </text>
  <text fill="#92400e" font-size="12" text-anchor="middle" x="690" y="750">
    Prometheus and Tempo store these separate telemetry streams, and Grafana unites them into a single platform to diagnose AI behavior.
  </text>

</svg>
