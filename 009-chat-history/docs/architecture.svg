  viewBox="0 0 1200 780" width="100%"
  xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter height="110%" id="shadow" width="110%" x="-5%" y="-5%">
      <feDropShadow dx="0" dy="2" flood-color="#000000" flood-opacity="0.06" stdDeviation="4"/>
