      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-slate" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect fill="#f8fafc" height="560" rx="12" stroke="#cbd5e1" stroke-dasharray="5 5" stroke-width="1.5" width="190" x="30" y="85"/>
  <rect fill="#ffffff" filter="url(#shadow)" height="130" rx="8" stroke="#94a3b8" stroke-width="1" width="170" x="40" y="145"/>
  <rect fill="#ffffff" filter="url(#shadow)" height="110" rx="8" stroke="#94a3b8" stroke-width="1" width="170" x="40" y="290"/>
  <rect fill="#eff6ff" height="560" rx="12" stroke="#2563eb" stroke-width="2" width="560" x="250" y="85"/>
  <rect fill="#ffffff" filter="url(#shadow)" height="52" rx="8" stroke="#3b82f6" stroke-width="1.5" width="520" x="270" y="132"/>
  <rect fill="#fdf4ff" height="150" rx="8" stroke="#c084fc" stroke-width="1.5" width="520" x="270" y="196"/>
  <rect fill="#ffffff" height="105" rx="6" stroke="#d8b4fe" stroke-width="1.5" width="235" x="285" y="228"/>
  <rect fill="#ffffff" height="105" rx="6" stroke="#d8b4fe" stroke-width="1.5" width="235" x="540" y="228"/>
  <rect fill="#fffbeb" height="150" rx="8" stroke="#f59e0b" stroke-width="1.5" width="520" x="270" y="362"/>
  <rect fill="#ffffff" height="105" rx="6" stroke="#fde68a" stroke-width="1" width="235" x="285" y="394"/>
  <rect fill="#ffffff" height="105" rx="6" stroke="#fde68a" stroke-width="1" width="235" x="540" y="394"/>
  <rect fill="#fdf4ff" height="106" rx="8" stroke="#c084fc" stroke-width="1.5" width="520" x="270" y="524"/>
  <rect fill="#ffffff" height="60" rx="6" stroke="#d8b4fe" stroke-width="1" width="235" x="285" y="556"/>
  <rect fill="#ffffff" height="60" rx="6" stroke="#d8b4fe" stroke-width="1" width="235" x="540" y="556"/>
  <rect fill="#faf5ff" height="240" rx="12" stroke="#9333ea" stroke-width="2" width="340" x="830" y="85"/>
  <rect fill="#f3e8ff" height="55" rx="6" stroke="#d8b4fe" stroke-width="1" width="310" x="845" y="248"/>
  <rect fill="#f8fafc" height="285" rx="10" stroke="#94a3b8" stroke-width="1.5" width="340" x="830" y="345"/>
  <rect fill="#fef2f2" height="115" rx="6" stroke="#fca5a5" stroke-width="1" width="316" x="840" y="498"/>
  <rect fill="#fffbeb" height="55" rx="8" stroke="#f59e0b" stroke-width="1.5" width="1140" x="30" y="675"/>

  <line marker-end="url(#arrow-blue)" stroke="#2563eb" stroke-width="2" x1="845" x2="885" y1="393" y2="393"/>
  <line marker-end="url(#arrow-purple)" stroke="#7c3aed" stroke-width="2" x1="845" x2="885" y1="421" y2="421"/>
  <line marker-end="url(#arrow-green)" stroke="#059669" stroke-width="2" x1="845" x2="885" y1="449" y2="449"/>
  <line marker-end="url(#arrow-slate)" stroke="#64748b" stroke-width="2" x1="845" x2="885" y1="477" y2="477"/>
  <line marker-end="url(#arrow-blue)" stroke="#2563eb" stroke-width="2" x1="210" x2="270" y1="155" y2="155"/>
  <line marker-end="url(#arrow-blue)" stroke="#2563eb" stroke-width="2" x1="270" x2="210" y1="175" y2="175"/>
  <line marker-end="url(#arrow-slate)" stroke="#64748b" stroke-width="1.5" x1="210" x2="270" y1="330" y2="330"/>
  <line marker-end="url(#arrow-purple)" stroke="#7c3aed" stroke-width="2" x1="790" x2="830" y1="130" y2="130"/>
  <line marker-end="url(#arrow-green)" stroke="#059669" stroke-dasharray="4 4" stroke-width="1.5" x1="530" x2="530" y1="346" y2="362"/>
  <line marker-end="url(#arrow-green)" stroke="#059669" stroke-dasharray="4 4" stroke-width="1.5" x1="530" x2="530" y1="512" y2="524"/>
  <path d="M 775,300 L 787,300 L 787,586 L 774,586" fill="none" marker-end="url(#arrow-slate)" stroke="#64748b" stroke-width="1.5"/>

  <rect fill="#ffffff" height="16" rx="3" stroke="#2563eb" stroke-width="1" width="60" x="185" y="138"/>
  <rect fill="#ffffff" height="16" rx="3" stroke="#2563eb" stroke-width="1" width="60" x="185" y="178"/>
  <rect fill="#ffffff" height="16" rx="3" stroke="#64748b" stroke-width="1" width="60" x="30" y="415"/>
  <rect fill="#ffffff" height="16" rx="3" stroke="#7c3aed" stroke-width="1" width="45" x="740" y="114"/>
  <rect fill="#ffffff" height="16" rx="3" stroke="#059669" stroke-width="1" width="120" x="470" y="507"/>
  <rect fill="#ffffff" height="15" rx="3" stroke="#64748b" stroke-width="1" width="58" x="758" y="428"/>

  <text fill="#0f172a" font-size="20" font-weight="700" text-anchor="middle" x="600" y="35">Spring AI Chat History Architecture</text>
  <text fill="#64748b" font-size="13" text-anchor="middle" x="600" y="55">Focused Lesson View: A Durable Audit Log That Never Feeds Back Into a
    Prompt
  </text>
  <text fill="#334155" font-size="14" font-weight="700" text-anchor="middle" x="125" y="112">Chat Client / HTTP</text>
  <text fill="#64748b" font-size="11" text-anchor="middle" x="125" y="128">curl / REST Client</text>
  <text fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle" x="125" y="170">GET /chat</text>
  <text fill="#475569" font-size="9.5" font-style="italic" text-anchor="middle" x="125" y="190">message="..."</text>
  <text fill="#2563eb" font-size="9.5" font-weight="600" text-anchor="middle" x="125" y="206">conversationId="abc"</text>
  <text fill="#64748b" font-size="9" text-anchor="middle" x="125" y="228">Same contract as</text>
  <text fill="#64748b" font-size="9" text-anchor="middle" x="125" y="241">the previous module, unchanged</text>
  <text fill="#94a3b8" font-size="8.5" font-style="italic" text-anchor="middle" x="125" y="262">generation call</text>
  <text fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle" x="125" y="315">GET /chat/{id}</text>
  <text fill="#475569" font-size="9.5" font-style="italic" text-anchor="middle" x="125" y="336">/chat/abc</text>
  <text fill="#64748b" font-size="9" text-anchor="middle" x="125" y="356">A new, separate route —</text>
  <text fill="#64748b" font-size="9" text-anchor="middle" x="125" y="369">not folded into /chat</text>
  <text fill="#94a3b8" font-size="8.5" font-style="italic" text-anchor="middle" x="125" y="388">audit read, no LLM at all</text>
  <text fill="#1e40af" font-size="15" font-weight="700" text-anchor="middle" x="530" y="112">Spring AI Application</text>
  <text fill="#1d4ed8" font-size="13" font-weight="700" text-anchor="middle" x="530" y="153">Worldcup2026Controller: /chat, /chat/{conversationId}
  </text>
  <text fill="#475569" font-size="10" text-anchor="middle" x="530" y="171">Controller delegates to a service for the first time in this arc</text>
  <text fill="#7e22ce" font-size="12" font-weight="700" text-anchor="middle" x="530" y="216">Worldcup2026Service</text>
  <text fill="#6b21a8" font-size="10.5" font-weight="700" text-anchor="middle" x="402" y="246">chat(message, conversationId)</text>
  <text fill="#581c87" font-size="9.5" x="295" y="264">1. answer = respond(...)</text>
  <text fill="#581c87" font-size="9.5" x="295" y="279">— identical to the previous module's logic</text>
  <text fill="#7e22ce" font-size="9.5" font-weight="600" x="295" y="296">2. record("user", message)</text>
  <text fill="#7e22ce" font-size="9.5" font-weight="600" x="295" y="311">3. record("assistant", answer)</text>
  <text fill="#9333ea" font-size="9" font-style="italic" x="295" y="326">4. return answer</text>
  <text fill="#6b21a8" font-size="10.5" font-weight="700" text-anchor="middle" x="657" y="246">history(conversationId)</text>
  <text fill="#581c87" font-size="9.5" x="550" y="268">chatHistoryRepository</text>
  <text fill="#581c87" font-size="9.5" x="550" y="284">.findByConversationId(...)</text>
  <text fill="#9333ea" font-size="9" font-style="italic" x="550" y="305">Straight to Postgres.</text>
  <text fill="#dc2626" font-size="9" font-weight="700" x="550" y="319">No ChatClient involved at all.</text>
  <text fill="#b45309" font-size="12" font-weight="700" text-anchor="middle" x="530" y="382">Two Datastores, Two Jobs — Never Confuse Them</text>
  <text fill="#92400e" font-size="10.5" font-weight="700" text-anchor="middle" x="402" y="412">Chat Memory (previous module)</text>
  <text fill="#78350f" font-size="9" x="295" y="430">• Windowed, last 20 messages</text>
  <text fill="#78350f" font-size="9" x="295" y="445">• Read back into the NEXT prompt</text>
  <text fill="#78350f" font-size="9" x="295" y="460">• Old turns get evicted, gone</text>
  <text fill="#92400e" font-size="8.5" font-style="italic" x="295" y="478">Shapes what the model sees</text>
  <text fill="#92400e" font-size="8.5" font-style="italic" x="295" y="491">Unchanged, still order 20</text>
  <text fill="#92400e" font-size="10.5" font-weight="700" text-anchor="middle" x="657" y="412">Chat History (this module)</text>
  <text fill="#78350f" font-size="9" x="550" y="430">• Append-only, every turn, forever</text>
  <text fill="#78350f" font-size="9" x="550" y="445">• NEVER read back into a prompt</text>
  <text fill="#78350f" font-size="9" x="550" y="460">• Survives memory eviction</text>
  <text fill="#dc2626" font-size="8.5" font-weight="700" x="550" y="478">Audit record, not model input</text>
  <text fill="#92400e" font-size="8.5" font-style="italic" x="550" y="491">New: chat_history table</text>
  <text fill="#7e22ce" font-size="12" font-weight="700" text-anchor="middle" x="530" y="544">PostgreSQL — Same Instance, Two Tables</text>
  <text fill="#6b21a8" font-size="10" font-weight="700" text-anchor="middle" x="402" y="573">spring_ai_chat_memory</text>
  <text fill="#581c87" font-size="8.5" text-anchor="middle" x="402" y="590">managed by MessageChatMemoryAdvisor</text>
  <text fill="#581c87" font-size="8.5" text-anchor="middle" x="402" y="603">(unchanged since the previous module)</text>
  <text fill="#6b21a8" font-size="10" font-weight="700" text-anchor="middle" x="657" y="573">chat_history</text>
  <text fill="#581c87" font-size="8.5" text-anchor="middle" x="657" y="590">ChatHistorySchemaInitializer,</text>
  <text fill="#581c87" font-size="8.5" text-anchor="middle" x="657" y="603">idempotent CREATE TABLE IF NOT EXISTS</text>
  <text fill="#6b21a8" font-size="15" font-weight="700" text-anchor="middle" x="1000" y="112">LLM Model</text>
  <text fill="#581c87" font-size="11" x="850" y="145">• Only reached via chat(...)'s respond()</text>
  <text fill="#581c87" font-size="11" x="850" y="167">• Identical call to the previous module's</text>
  <text fill="#581c87" font-size="11" x="864" y="185">memoryAwareChatClient</text>
  <text fill="#581c87" font-size="11" x="850" y="207">• Has no idea its answer is about to be</text>
  <text fill="#581c87" font-size="11" x="864" y="225">recorded into a second table afterwards</text>
  <text fill="#6b21a8" font-size="10.5" font-weight="700" text-anchor="middle" x="1000" y="268">/chat/{conversationId} never calls this box</text>
  <text fill="#581c87" font-size="9" text-anchor="middle" x="1000" y="285">The audit read path bypasses the model entirely</text>
  <text fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle" x="1000" y="368">Execution Step Legend</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="397">1, 6. /chat Request / Response</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="425">2. respond() → Prompt / Answer</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="453">3, 4. Record user / assistant turn</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="481">A, B. /chat/{id} read, no LLM hop</text>
  <text fill="#dc2626" font-size="9.5" font-weight="700" text-anchor="middle" x="1000" y="516">Why record unconditionally?</text>
  <text fill="#991b1b" font-size="8.5" text-anchor="middle" x="1000" y="533">Because every later module in this series —</text>
  <text fill="#991b1b" font-size="8.5" text-anchor="middle" x="1000" y="547">RAG, guarded, step-back, observability — carries</text>
  <text fill="#991b1b" font-size="8.5" text-anchor="middle" x="1000" y="561">this exact "compute, then record, then return"</text>
  <text fill="#991b1b" font-size="8.5" text-anchor="middle" x="1000" y="575">wrapper forward untouched, no matter how many</text>
  <text fill="#991b1b" font-size="8.5" text-anchor="middle" x="1000" y="589">more response paths get added on top of it.</text>
  <text fill="#dc2626" font-size="8.5" font-weight="700" text-anchor="middle" x="1000" y="605">This module is where that shape is born.</text>
  <text fill="#2563eb" font-size="8" font-weight="700" text-anchor="middle" x="215" y="150">1. /chat</text>
  <text fill="#2563eb" font-size="8" font-weight="700" text-anchor="middle" x="215" y="190">6. Answer</text>
  <text fill="#64748b" font-size="8" font-weight="700" text-anchor="middle" x="60" y="427">A. /chat/id</text>
  <text fill="#7c3aed" font-size="8" font-weight="700" text-anchor="middle" x="762" y="126">2.</text>
  <text fill="#059669" font-size="8" font-weight="700" text-anchor="middle" x="530" y="519">3, 4. Record turns</text>
  <text fill="#64748b" font-size="7.5" font-weight="700" text-anchor="middle" x="787" y="439">B. read</text>
  <text fill="#b45309" font-size="12" font-weight="700" text-anchor="middle" x="600" y="698">CHAT HISTORY LESSON: Durable, Append-Only, Never Read
    Back — Audit Is Not Memory
  </text>
  <text fill="#92400e" font-size="11" text-anchor="middle" x="600" y="716">If memory evicts a turn, follow-ups can't reference it any more;
    chat_history doesn't care, it was never in the business of feeding the model anything.
  </text>
</svg>
