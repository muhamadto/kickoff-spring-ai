<svg style="background-color: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;" height="100%"
  viewBox="0 0 1200 780" width="100%"
  xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Standard SVG 1.1 Compatible Arrowhead Markers -->
    <filter height="110%" id="shadow" width="110%" x="-5%" y="-5%">
      <feDropShadow dx="0" dy="2" flood-color="#000000" flood-opacity="0.05" stdDeviation="4"/>
    </filter>
    <marker id="arrow-purple" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-amber" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-green" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>

    <!-- Shadow Filter -->
    <marker id="arrow-blue" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect fill="#f8fafc" height="590" rx="12" stroke="#cbd5e1" stroke-dasharray="5 5" stroke-width="1.5" width="210" x="30" y="75"/>
  <rect fill="#ffffff" filter="url(#shadow)" height="180" rx="8" stroke="#94a3b8" stroke-width="1" width="180" x="45" y="170"/>
  <rect fill="#eff6ff" height="590" rx="12" stroke="#2563eb" stroke-width="2" width="475" x="275" y="75"/>
  <rect fill="#ffffff" filter="url(#shadow)" height="165" rx="8" stroke="#3b82f6" stroke-width="1.5" width="435" x="295" y="145"/>
  <rect fill="#ecfdf5" height="305" rx="8" stroke="#059669" stroke-width="1.5" width="435" x="295" y="340"/>
  <rect fill="#ffffff" height="110" rx="6" stroke="#a7f3d0" stroke-width="1" width="205" x="305" y="380"/>
  <rect fill="#ffffff" height="110" rx="6" stroke="#a7f3d0" stroke-width="1" width="200" x="520" y="380"/>
  <rect fill="#ffffff" height="80" rx="6" stroke="#a7f3d0" stroke-width="1" width="205" x="305" y="500"/>
  <rect fill="#ffffff" height="80" rx="6" stroke="#a7f3d0" stroke-width="1" width="200" x="520" y="500"/>
  <rect fill="#ffffff" height="35" rx="6" stroke="#6ee7b7" stroke-width="1" width="415" x="305" y="590"/>
  <rect fill="#faf5ff" height="400" rx="12" stroke="#9333ea" stroke-width="2" width="320" x="850" y="75"/>
  <rect fill="#fef2f2" height="40" rx="6" stroke="#fca5a5" stroke-width="1" width="200" x="910" y="145"/>
  <rect fill="#f3e8ff" height="40" rx="6" stroke="#d8b4fe" stroke-width="1" width="290" x="865" y="325"/>
  <rect fill="#f8fafc" height="175" rx="10" stroke="#94a3b8" stroke-width="1.5" width="320" x="850" y="490"/>
  <rect fill="#ffffff" height="28" rx="3" stroke="#d97706" stroke-width="1" width="110" x="735" y="190"/>
  <rect fill="#ffffff" height="28" rx="3" stroke="#7c3aed" stroke-width="1" width="110" x="735" y="280"/>
  <rect fill="#fef2f2" height="50" rx="8" stroke="#ef4444" stroke-width="1.5" width="1140" x="30" y="695"/>

  <line marker-end="url(#arrow-blue)" stroke="#2563eb" stroke-width="2" x1="865" x2="905" y1="540" y2="540"/>
  <line marker-end="url(#arrow-purple)" stroke="#7c3aed" stroke-width="2" x1="865" x2="905" y1="570" y2="570"/>
  <line marker-end="url(#arrow-amber)" stroke="#d97706" stroke-width="2" x1="865" x2="905" y1="600" y2="600"/>
  <line marker-end="url(#arrow-green)" stroke="#059669" stroke-width="2" x1="865" x2="905" y1="630" y2="630"/>
  <line marker-end="url(#arrow-blue)" stroke="#2563eb" stroke-width="2" x1="225" x2="295" y1="200" y2="200"/>
  <line marker-end="url(#arrow-purple)" stroke="#7c3aed" stroke-width="2" x1="730" x2="850" y1="175" y2="175"/>
  <line marker-end="url(#arrow-amber)" stroke="#d97706" stroke-width="2" x1="850" x2="730" y1="223" y2="223"/>
  <line marker-end="url(#arrow-green)" stroke="#059669" stroke-width="2" x1="410" x2="410" y1="310" y2="340"/>
  <line marker-end="url(#arrow-green)" stroke="#059669" stroke-width="2" x1="620" x2="620" y1="340" y2="310"/>
  <line marker-end="url(#arrow-purple)" stroke="#7c3aed" stroke-width="2" x1="730" x2="850" y1="270" y2="270"/>
  <line marker-end="url(#arrow-purple)" stroke="#7c3aed" stroke-width="2" x1="850" x2="730" y1="315" y2="315"/>
  <line marker-end="url(#arrow-blue)" stroke="#2563eb" stroke-width="2" x1="295" x2="225" y1="290" y2="290"/>

  <rect fill="#ffffff" height="20" rx="3" stroke="#2563eb" stroke-width="1" width="90" x="215" y="174"/>
  <rect fill="#ffffff" height="20" rx="3" stroke="#7c3aed" stroke-width="1" width="100" x="740" y="150"/>
  <rect fill="#ffffff" height="20" rx="4" stroke="#059669" stroke-width="1" width="140" x="340" y="313"/>
  <rect fill="#ffffff" height="20" rx="4" stroke="#059669" stroke-width="1" width="130" x="555" y="313"/>
  <rect fill="#ffffff" height="20" rx="3" stroke="#7c3aed" stroke-width="1" width="100" x="740" y="245"/>
  <rect fill="#ffffff" height="20" rx="3" stroke="#2563eb" stroke-width="1" width="90" x="215" y="298"/>

  <text fill="#0f172a" font-size="20" font-weight="700" text-anchor="middle" x="600" y="36">Spring AI MCP Server Architecture</text>
  <text fill="#64748b" font-size="13" text-anchor="middle" x="600" y="56">Complete MCP Capabilities: Tools, Resources, Prompts &amp; Completions
  </text>
  <text fill="#334155" font-size="14" font-weight="700" text-anchor="middle" x="135" y="105">Chat Client / HTTP</text>
  <text fill="#64748b" font-size="11" text-anchor="middle" x="135" y="125">(Requests.http)</text>
  <text fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle" x="135" y="210">Client/User</text>
  <text fill="#475569" font-size="11" font-style="italic" text-anchor="middle" x="135" y="245">Sends query:</text>
  <text fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle" x="135" y="265">"Get venue details</text>
  <text fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle" x="135" y="280">for Dallas"</text>
  <text fill="#1e40af" font-size="15" font-weight="700" text-anchor="middle" x="512" y="105">Spring AI Application &amp; MCP Server</text>
  <text fill="#2563eb" font-size="11" font-weight="600" text-anchor="middle" x="512" y="125">MCP Streamable Transport Boundary (port 8085 /mcp)</text>
  <text fill="#1d4ed8" font-size="13" font-weight="700" text-anchor="middle" x="512" y="170">MCP Client / ChatClient</text>
  <text fill="#334155" font-size="11" x="310" y="195">• Connects to MCP Server via Streamable HTTP transport</text>
  <text fill="#334155" font-size="11" x="310" y="218">• Discovers capabilities (Tools, Resources, Prompts, Completions)</text>
  <text fill="#334155" font-size="11" x="310" y="241">• Registers remote MCP tool schemas into ChatClient</text>
  <text fill="#334155" font-size="11" x="310" y="264">• Manages execution loop &amp; payload marshalling</text>
  <text fill="#065f46" font-size="13" font-weight="700" text-anchor="middle" x="512" y="365">MCP Server Capabilities (@McpServer)</text>
  <text fill="#047857" font-size="11" font-weight="700" text-anchor="middle" x="407" y="398">Tools (@McpTool)</text>
  <text fill="#065f46" font-size="10" x="313" y="416">• World Cup Tools</text>
  <text fill="#065f46" font-size="10" x="313" y="432">• get-venue, get-teams</text>
  <text fill="#065f46" font-size="10" x="313" y="448">• get-fixtures, get-player</text>
  <text fill="#065f46" font-size="10" x="313" y="464">• get-news, get-referees...</text>
  <text fill="#047857" font-size="9" font-style="italic" x="313" y="480">(Model suggests call)</text>
  <text fill="#047857" font-size="11" font-weight="700" text-anchor="middle" x="620" y="398">Resources (@McpResource)</text>
  <text fill="#065f46" font-size="10" x="528" y="416">• worldcup://stadiums</text>
  <text fill="#065f46" font-size="10" x="528" y="432">• worldcup://fixtures/{date}</text>
  <text fill="#065f46" font-size="10" x="528" y="448">• worldcup://teams/{t}/squad</text>
  <text fill="#065f46" font-size="10" x="528" y="464">• worldcup://groups/{g}/table</text>
  <text fill="#047857" font-size="9" font-style="italic" x="528" y="480">(App/User attaches content)</text>
  <text fill="#047857" font-size="11" font-weight="700" text-anchor="middle" x="407" y="518">Prompts (@McpPrompt)</text>
  <text fill="#065f46" font-size="10" x="313" y="536">• match-recap(fixture)</text>
  <text fill="#065f46" font-size="10" x="313" y="552">• Server-owned prompt templates</text>
  <text fill="#047857" font-size="9" font-style="italic" x="313" y="568">(Shared across all clients)</text>
  <text fill="#047857" font-size="11" font-weight="700" text-anchor="middle" x="620" y="518">Completions (@McpComplete)</text>
  <text fill="#065f46" font-size="10" x="528" y="536">• completeRecapFixture</text>
  <text fill="#065f46" font-size="10" x="528" y="552">• completeSquadTeam</text>
  <text fill="#047857" font-size="9" font-style="italic" x="528" y="568">(Autocomplete args &amp; URI vars)</text>
  <text fill="#0f766e" font-size="11" font-weight="600" text-anchor="middle" x="512" y="612">[ Standalone Dataset: TeamData, VenueData, MatchData...
    ]
  </text>
  <text fill="#6b21a8" font-size="15" font-weight="700" text-anchor="middle" x="1010" y="105">LLM Model</text>
  <text fill="#dc2626" font-size="10" font-weight="700" text-anchor="middle" x="1010" y="162">Search Grounding</text>
  <text fill="#dc2626" font-size="10" font-weight="700" text-anchor="middle" x="1010" y="176">[ DISABLED ]</text>
  <text fill="#581c87" font-size="11" x="870" y="215">• Receives prompt + MCP tool schemas</text>
  <text fill="#581c87" font-size="11" x="870" y="240">• Decides tool relevance</text>
  <text fill="#581c87" font-size="11" x="870" y="265">• Returns tool call request</text>
  <text fill="#581c87" font-size="11" x="870" y="290">• Formulates final textual response</text>
  <text fill="#6b21a8" font-size="11" font-weight="700" text-anchor="middle" x="1010" y="350">⚠️ Model NEVER calls a function (tool)</text>
  <text fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle" x="1010" y="515">Architecture Legend</text>
  <text fill="#334155" font-size="11" font-weight="600" x="915" y="544">App Data Flow (User Request / Result)</text>
  <text fill="#334155" font-size="11" font-weight="600" x="915" y="574">LLM Communication (Prompt / Response)</text>
  <text fill="#334155" font-size="11" font-weight="600" x="915" y="604">Tool Call Suggestion (Method Request)</text>
  <text fill="#334155" font-size="11" font-weight="600" x="915" y="634">MCP Protocol Execution (@McpTool)</text>
  <text fill="#2563eb" font-size="9" font-weight="700" text-anchor="middle" x="260" y="188">1. User Query</text>
  <text fill="#7c3aed" font-size="9" font-weight="700" text-anchor="middle" x="790" y="164">2. Send Schemas</text>
  <text fill="#d97706" font-size="8" font-weight="700" text-anchor="middle" x="790" y="200">3. Tool Call Request</text>
  <text fill="#d97706" font-size="8" text-anchor="middle" x="790" y="210">('get-venue')</text>
  <text fill="#059669" font-size="9" font-weight="700" text-anchor="middle" x="410" y="327">4. Call @McpTool via /mcp</text>
  <text fill="#059669" font-size="9" font-weight="700" text-anchor="middle" x="620" y="327">5. Return MCP Data</text>
  <text fill="#7c3aed" font-size="9" font-weight="700" text-anchor="middle" x="790" y="257">6. Send Tool Result</text>
  <text fill="#7c3aed" font-size="8" font-weight="700" text-anchor="middle" x="790" y="295">7. Model Grounded</text>
  <text fill="#7c3aed" font-size="8" font-weight="700" text-anchor="middle" x="790" y="304">Response</text>
  <text fill="#2563eb" font-size="9" font-weight="700" text-anchor="middle" x="260" y="312">8. Final Answer</text>
  <text fill="#991b1b" font-size="13" font-weight="700" text-anchor="middle" x="600" y="725">CRITICAL EXECUTION BOUNDARY: The LLM ONLY suggests
    function calls. The MCP Server executes Tools, serves Resources, Prompts &amp; Autocomplete.
  </text>
</svg>
