<svg style="background-color: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;" height="100%"
  viewBox="0 0 1200 780" width="100%"
  xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter height="110%" id="shadow" width="110%" x="-5%" y="-5%">
      <feDropShadow dx="0" dy="2" flood-color="#000000" flood-opacity="0.06" stdDeviation="4"/>
    </filter>
    <marker id="arrow-purple" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-blue" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect fill="#f8fafc" height="560" rx="12" stroke="#cbd5e1" stroke-dasharray="5 5" stroke-width="1.5" width="190" x="30" y="85"/>
  <rect fill="#ffffff" filter="url(#shadow)" height="175" rx="8" stroke="#94a3b8" stroke-width="1" width="170" x="40" y="145"/>
  <rect fill="#eff6ff" height="560" rx="12" stroke="#2563eb" stroke-width="2" width="560" x="250" y="85"/>
  <rect fill="#ffffff" filter="url(#shadow)" height="55" rx="8" stroke="#3b82f6" stroke-width="1.5" width="520" x="270" y="132"/>
  <rect fill="#fdf4ff" height="70" rx="8" stroke="#c084fc" stroke-width="1.5" width="520" x="270" y="200"/>
  <rect fill="#f0fdf4" height="120" rx="8" stroke="#16a34a" stroke-width="1.5" width="520" x="270" y="285"/>
  <rect fill="#dcfce7" height="75" rx="6" stroke="#22c55e" stroke-width="1.5" width="490" x="285" y="317"/>
  <rect fill="#ffffff" height="90" rx="8" stroke="#94a3b8" stroke-width="1" width="520" x="270" y="418"/>
  <rect fill="#fdf4ff" height="108" rx="8" stroke="#c084fc" stroke-width="1.5" width="520" x="270" y="522"/>
  <rect fill="#ffffff" height="66" rx="6" stroke="#d8b4fe" stroke-width="1" width="490" x="285" y="554"/>
  <rect fill="#faf5ff" height="300" rx="12" stroke="#9333ea" stroke-width="2" width="340" x="830" y="85"/>
  <rect fill="#fef2f2" height="55" rx="6" stroke="#fca5a5" stroke-width="1" width="290" x="855" y="135"/>
  <rect fill="#f3e8ff" height="45" rx="6" stroke="#d8b4fe" stroke-width="1" width="310" x="845" y="305"/>
  <rect fill="#f8fafc" height="225" rx="10" stroke="#94a3b8" stroke-width="1.5" width="340" x="830" y="405"/>
  <rect fill="#fffbeb" height="60" rx="6" stroke="#f59e0b" stroke-width="1" width="316" x="840" y="555"/>
  <rect fill="#fffbeb" height="55" rx="8" stroke="#f59e0b" stroke-width="1.5" width="1140" x="30" y="675"/>

  <line marker-end="url(#arrow-blue)" stroke="#2563eb" stroke-width="2" x1="845" x2="885" y1="453" y2="453"/>
  <line marker-end="url(#arrow-green)" stroke="#059669" stroke-width="2" x1="845" x2="885" y1="481" y2="481"/>
  <line marker-end="url(#arrow-purple)" stroke="#7c3aed" stroke-width="2" x1="845" x2="885" y1="509" y2="509"/>
  <line marker-end="url(#arrow-green)" stroke="#059669" stroke-width="2" x1="845" x2="885" y1="537" y2="537"/>
  <line marker-end="url(#arrow-blue)" stroke="#2563eb" stroke-width="2" x1="210" x2="270" y1="160" y2="160"/>
  <line marker-end="url(#arrow-blue)" stroke="#2563eb" stroke-width="2" x1="270" x2="210" y1="190" y2="190"/>
  <line marker-end="url(#arrow-green)" stroke="#059669" stroke-dasharray="4 4" stroke-width="1.5" x1="530" x2="530" y1="405" y2="522"/>
  <line marker-end="url(#arrow-purple)" stroke="#7c3aed" stroke-width="2" x1="790" x2="830" y1="225" y2="225"/>
  <line marker-end="url(#arrow-purple)" stroke="#7c3aed" stroke-width="2" x1="830" x2="790" y1="255" y2="255"/>

  <rect fill="#ffffff" height="16" rx="3" stroke="#2563eb" stroke-width="1" width="70" x="185" y="143"/>
  <rect fill="#ffffff" height="16" rx="3" stroke="#2563eb" stroke-width="1" width="70" x="185" y="193"/>
  <rect fill="#ffffff" height="16" rx="3" stroke="#059669" stroke-width="1" width="120" x="470" y="507"/>
  <rect fill="#ffffff" height="16" rx="3" stroke="#7c3aed" stroke-width="1" width="65" x="795" y="228"/>
  <rect fill="#ffffff" height="16" rx="3" stroke="#7c3aed" stroke-width="1" width="65" x="795" y="258"/>

  <text fill="#0f172a" font-size="20" font-weight="700" text-anchor="middle" x="600" y="35">Spring AI Chat Memory Architecture</text>
  <text fill="#64748b" font-size="13" text-anchor="middle" x="600" y="55">Focused Lesson View: Windowed, JDBC-Backed Memory via Client Mutation</text>
  <text fill="#334155" font-size="14" font-weight="700" text-anchor="middle" x="125" y="112">Chat Client / HTTP</text>
  <text fill="#64748b" font-size="11" text-anchor="middle" x="125" y="128">curl / REST Client</text>
  <text fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle" x="125" y="170">Client/User</text>
  <text fill="#475569" font-size="10.5" font-style="italic" text-anchor="middle" x="125" y="196">GET /chat</text>
  <text fill="#1e293b" font-size="9.5" font-weight="600" text-anchor="middle" x="125" y="216">message="Who did Morocco</text>
  <text fill="#1e293b" font-size="9.5" font-weight="600" text-anchor="middle" x="125" y="230">play first?"</text>
  <text fill="#2563eb" font-size="9.5" font-weight="600" text-anchor="middle" x="125" y="252">conversationId="008"</text>
  <text fill="#64748b" font-size="9" text-anchor="middle" x="125" y="278">Follow-up turn:</text>
  <text fill="#1e293b" font-size="9" font-style="italic" text-anchor="middle" x="125" y="292">"...and who scored?"</text>
  <text fill="#64748b" font-size="8.5" text-anchor="middle" x="125" y="306">(no team name repeated)</text>
  <text fill="#1e40af" font-size="15" font-weight="700" text-anchor="middle" x="530" y="112">Spring AI Application</text>
  <text fill="#1d4ed8" font-size="13" font-weight="700" text-anchor="middle" x="530" y="154">Chat Controller: GET /chat</text>
  <text fill="#475569" font-size="10" text-anchor="middle" x="530" y="173">Every earlier endpoint collapsed into this one</text>
  <text fill="#7e22ce" font-size="11" font-weight="700" text-anchor="middle" x="530" y="220">memoryAwareChatClient =
    memoryNotAwareChatClient
  </text>
  <text fill="#7e22ce" font-size="11" font-weight="700" text-anchor="middle" x="530" y="237">
    .mutate().defaultAdvisors(messageChatMemoryAdvisor).build()
  </text>
  <text fill="#9333ea" font-size="9.5" font-style="italic" text-anchor="middle" x="530" y="256">Memory applies only to the client you ask for it on —
    not every client in the app
  </text>
  <text fill="#15803d" font-size="12" font-weight="700" text-anchor="middle" x="530" y="305">ChatClient Advisor Pipeline</text>
  <text fill="#14532d" font-size="11" font-weight="700" x="295" y="337">MessageChatMemoryAdvisor</text>
  <text fill="#15803d" font-size="10" font-weight="700" text-anchor="end" x="765" y="337">Order: 20</text>
  <text fill="#166534" font-size="9.5" x="295" y="355">• Before the call: loads the window for this conversationId, injects it into the prompt</text>
  <text fill="#166534" font-size="9.5" x="295" y="371">• After the call: writes the new user+assistant turn back to the repository</text>
  <text fill="#047857" font-size="9" font-style="italic" x="295" y="385">ChatMemory.CONVERSATION_ID is required — omit it and the call throws</text>
  <text fill="#334155" font-size="11" font-weight="700" text-anchor="middle" x="530" y="438">MessageWindowChatMemory.builder().maxMessages(20)</text>
  <text fill="#475569" font-size="9.5" x="282" y="458">• A sliding window: the last 20 messages, oldest evicted first</text>
  <text fill="#475569" font-size="9.5" x="282" y="474">• Distinct from chat history: this shapes what the model sees next, nothing more</text>
  <text fill="#64748b" font-size="9" font-style="italic" x="282" y="490">Tool-call messages are silently dropped by the JDBC repository — see the
    README warning
  </text>
  <text fill="#7e22ce" font-size="12" font-weight="700" text-anchor="middle" x="530" y="542">PostgreSQL Database Layer</text>
  <text fill="#6b21a8" font-size="11" font-weight="700" text-anchor="middle" x="530" y="572">JDBC Chat Memory (ChatMemoryRepository)</text>
  <text fill="#581c87" font-size="9.5" x="295" y="590">• First datastore this series uses — pgvector/pgvector:pg17, but no vector column yet</text>
  <text fill="#581c87" font-size="9.5" x="295" y="605">• Already on the classpath via spring-ai-starter-model-chat-memory-repository-jdbc</text>
  <text fill="#6b21a8" font-size="15" font-weight="700" text-anchor="middle" x="1000" y="112">LLM Model</text>
  <text fill="#dc2626" font-size="10.5" font-weight="700" text-anchor="middle" x="1000" y="155">Stateless model, statefully served</text>
  <text fill="#991b1b" font-size="9" text-anchor="middle" x="1000" y="172">Every call is independent — the illusion of</text>
  <text fill="#991b1b" font-size="9" text-anchor="middle" x="1000" y="184">memory comes entirely from the advisor</text>
  <text fill="#581c87" font-size="11" x="850" y="220">• Receives the injected window of prior turns</text>
  <text fill="#581c87" font-size="11" x="850" y="242">• Receives the new user message</text>
  <text fill="#581c87" font-size="11" x="850" y="264">• Resolves "and who scored?" using the</text>
  <text fill="#581c87" font-size="11" x="864" y="282">injected history, not its own state</text>
  <text fill="#6b21a8" font-size="10.5" font-weight="700" text-anchor="middle" x="1000" y="325">⚠️ No memory client-side either</text>
  <text fill="#581c87" font-size="9" text-anchor="middle" x="1000" y="340">Restart the app: history survives in Postgres</text>
  <text fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle" x="1000" y="428">Execution Step Legend</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="457">1, 6. Client Request / Response</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="485">2. Load Window (JDBC read)</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="513">3, 4. Full Prompt / Model Response</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="541">5. Save Turn (JDBC write)</text>
  <text fill="#b45309" font-size="9.5" font-weight="700" text-anchor="middle" x="1000" y="573">Memory ≠ History</text>
  <text fill="#92400e" font-size="8.5" text-anchor="middle" x="1000" y="588">This module is memory only. The durable,</text>
  <text fill="#92400e" font-size="8.5" text-anchor="middle" x="1000" y="600">never-fed-back audit log arrives in the next module</text>
  <text fill="#2563eb" font-size="8" font-weight="700" text-anchor="middle" x="220" y="155">1. GET /chat</text>
  <text fill="#2563eb" font-size="8" font-weight="700" text-anchor="middle" x="220" y="205">6. Answer</text>
  <text fill="#059669" font-size="8" font-weight="700" text-anchor="middle" x="530" y="519">2. Load / 5. Save</text>
  <text fill="#7c3aed" font-size="8" font-weight="700" text-anchor="middle" x="827" y="240">3. Prompt</text>
  <text fill="#7c3aed" font-size="8" font-weight="700" text-anchor="middle" x="827" y="270">4. Answer</text>
  <text fill="#b45309" font-size="12" font-weight="700" text-anchor="middle" x="600" y="698">CHAT MEMORY LESSON: A Stateless Model, Made Stateful by
    an Advisor and a Window, Not by the Model Itself
  </text>
  <text fill="#92400e" font-size="11" text-anchor="middle" x="600" y="716">MessageWindowChatMemory keeps the last 20 messages in Postgres. Mutate a
    client to add the advisor rather than wiring memory into every client by default.
  </text>
</svg>
