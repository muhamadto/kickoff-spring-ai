  <rect fill="#ffffff" height="14" rx="3" stroke="#2563eb" stroke-width="1" width="70" x="195" y="122"/>
  <rect fill="#ffffff" height="14" rx="3" stroke="#2563eb" stroke-width="1" width="70" x="195" y="168"/>
  <rect fill="#ffffff" height="14" rx="3" stroke="#7c3aed" stroke-width="1" width="80" x="755" y="122"/>
  <rect fill="#ffffff" height="14" rx="3" stroke="#7c3aed" stroke-width="1" width="80" x="755" y="168"/>
  <rect fill="#ffffff" height="15" rx="3" stroke="#059669" stroke-width="1" width="60" x="735" y="278"/>
  <rect fill="#ffffff" height="15" rx="3" stroke="#0d9488" stroke-width="1" width="55" x="220" y="365"/>
  <rect fill="#ffffff" height="15" rx="3" stroke="#d97706" stroke-width="1" width="55" x="760" y="235"/>
  <rect fill="#ffffff" height="15" rx="3" stroke="#d97706" stroke-width="1" width="55" x="760" y="475"/>

  <text fill="#0f172a" font-size="20" font-weight="700" text-anchor="middle" x="600" y="32">Spring AI Agentic RAG Architecture</text>
  <text fill="#64748b" font-size="13" text-anchor="middle" x="600" y="52">Autonomous Tool Execution (BookingTool) + Vector-only RAG
    (QuestionAnswerAdvisor)
  </text>
  <text fill="#334155" font-size="14" font-weight="700" text-anchor="middle" x="120" y="102">Chat Client / HTTP</text>
  <text fill="#64748b" font-size="11" text-anchor="middle" x="120" y="118">curl / REST Client</text>
  <text fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle" x="120" y="160">Client/User</text>
  <text fill="#475569" font-size="11" font-style="italic" text-anchor="middle" x="120" y="185">GET /chat</text>
  <text fill="#1e293b" font-size="9.5" font-weight="600" text-anchor="middle" x="120" y="205">question="Book 2 tickets</text>
  <text fill="#1e293b" font-size="9.5" font-weight="600" text-anchor="middle" x="120" y="218">for Morocco vs Haiti..."</text>
  <text fill="#2563eb" font-size="10" font-weight="600" text-anchor="middle" x="120" y="240">conversationId="007"</text>
  <text fill="#1e40af" font-size="15" font-weight="700" text-anchor="middle" x="515" y="102">Spring AI Application (Java)</text>
  <text fill="#1d4ed8" font-size="13" font-weight="700" text-anchor="middle" x="515" y="144">Chat Controller: GET /chat</text>
  <text fill="#475569" font-size="10" text-anchor="middle" x="515" y="162">Orchestrates ChatClient with Advisor Chain &amp;
    defaultTools(bookingTool)
  </text>
  <text fill="#15803d" font-size="12" font-weight="700" text-anchor="middle" x="515" y="210">ChatClient Advisor Chain (Complete Sequence)</text>
  <text fill="#166534" font-size="10" font-weight="700" x="283" y="239">PiiRedactionAdvisor</text>
  <text fill="#15803d" font-size="9" font-weight="700" text-anchor="end" x="497" y="239">Order 10</text>
  <text fill="#4b5563" font-size="9" x="283" y="255">• Strips PII prior to vector store</text>
  <text fill="#4b5563" font-size="9" x="283" y="268">and LLM invocation</text>
  <text fill="#166534" font-size="10" font-weight="700" x="533" y="239">MessageChatMemoryAdvisor</text>
  <text fill="#15803d" font-size="9" font-weight="700" text-anchor="end" x="747" y="239">Order 20</text>
  <text fill="#4b5563" font-size="9" x="533" y="255">• Loads conversation history</text>
  <text fill="#4b5563" font-size="9" x="533" y="268">• Persists multi-turn context</text>
  <text fill="#14532d" font-size="10" font-weight="700" x="283" y="319">QuestionAnswerAdvisor</text>
  <text fill="#15803d" font-size="9" font-weight="700" text-anchor="end" x="497" y="319">Order 25</text>
  <text fill="#166534" font-size="9" x="283" y="335">• Replaces HybridSearchAdvisor</text>
  <text fill="#166534" font-size="9" x="283" y="348">• Pure dense vector retrieval</text>
  <text fill="#047857" font-size="9" font-style="italic" x="283" y="361">• Injects facts into prompt</text>
  <text fill="#166534" font-size="10" font-weight="700" x="533" y="319">SimpleLoggerAdvisor</text>
  <text fill="#15803d" font-size="9" font-weight="700" text-anchor="end" x="747" y="319">Order 30</text>
  <text fill="#4b5563" font-size="9" x="533" y="335">• Logs request / prompt payloads</text>
  <text fill="#4b5563" font-size="9" x="533" y="348">• Logs final framework responses</text>
  <text fill="#4b5563" font-size="9" x="533" y="361">• Diagnostic tracer</text>
  <text fill="#b45309" font-size="12" font-weight="700" text-anchor="middle" x="515" y="426">Registered Component Tools (@Tool / defaultTools)</text>
  <text fill="#92400e" font-size="10.5" font-weight="700" x="285" y="451">BookingTool (@Tool: bookMatchTicket)</text>
  <text fill="#d97706" font-size="9" font-weight="700" text-anchor="end" x="745" y="451">Side-Effect Action</text>
  <text fill="#78350f" font-size="9" x="285" y="468">• Inputs: homeTeam, awayTeam, date, quantity | Generates reference code (WC26-XXXX)</text>
  <text fill="#7e22ce" font-size="12" font-weight="700" text-anchor="middle" x="515" y="520">PostgreSQL Database Layer</text>
  <text fill="#6b21a8" font-size="11" font-weight="700" text-anchor="middle" x="390" y="548">PGVector Store</text>
  <text fill="#7e22ce" font-size="9.5" font-weight="600" text-anchor="middle" x="390" y="563">Table: world_cup_knowledge</text>
  <text fill="#581c87" font-size="9.5" x="285" y="583">• Stores dense document embeddings</text>
  <text fill="#581c87" font-size="9.5" x="285" y="598">• Cosine similarity search</text>
  <text fill="#581c87" font-size="9.5" x="285" y="613">• Queried by QuestionAnswerAdvisor</text>
  <text fill="#6b21a8" font-size="11" font-weight="700" text-anchor="middle" x="640" y="548">JDBC Chat Memory</text>
  <text fill="#7e22ce" font-size="9.5" font-weight="600" text-anchor="middle" x="640" y="563">Table: spring_ai_chat_memory</text>
  <text fill="#581c87" font-size="9.5" x="535" y="583">• Persists turn history</text>
  <text fill="#581c87" font-size="9.5" x="535" y="598">• Keyed by conversationId</text>
  <text fill="#581c87" font-size="9.5" x="535" y="613">• Read/Write by MemoryAdvisor</text>
  <text fill="#6b21a8" font-size="15" font-weight="700" text-anchor="middle" x="995" y="102">LLM Model</text>
  <text fill="#92400e" font-size="10.5" font-weight="700" text-anchor="middle" x="995" y="153">🤖 Agentic Decision Core</text>
  <text fill="#581c87" font-size="10" x="845" y="188">• Inspects user prompt &amp; retrieved facts</text>
  <text fill="#581c87" font-size="10" x="845" y="206">• Evaluates tool metadata (@Tool description)</text>
  <text fill="#b45309" font-size="10" font-weight="700" x="845" y="224">• Directs application to autonomously call bookMatchTicket</text>
  <text fill="#581c87" font-size="10" x="845" y="242">• Extracts tool arguments (teams, date, count)</text>
  <text fill="#581c87" font-size="10" x="845" y="260">• Receives execution output &amp; synthesizes answer</text>
  <text fill="#6b21a8" font-size="10.5" font-weight="700" text-anchor="middle" x="995" y="300">Framework Tool Call Loop</text>
  <text fill="#581c87" font-size="9" x="850" y="320">1. Prompt + Tools → LLM Tool Call Request</text>
  <text fill="#581c87" font-size="9" x="850" y="338">2. Spring AI executes bookMatchTicket locally</text>
  <text fill="#581c87" font-size="9" x="850" y="356">3. Tool Result sent back to LLM</text>
  <text fill="#15803d" font-size="9" font-weight="700" x="850" y="374">4. Final answer with booking reference returned</text>
  <text fill="#1e293b" font-size="12" font-weight="700" text-anchor="middle" x="995" y="452">Execution Step Sequence</text>
  <text fill="#334155" font-size="9.5" font-weight="600" x="885" y="474">1, 8. HTTP Client Request / Response</text>
  <text fill="#334155" font-size="9.5" font-weight="600" x="885" y="496">2. Read Conversation History (JDBC)</text>
  <text fill="#334155" font-size="9.5" font-weight="600" x="885" y="518">3. Vector Search (PGVector QAAdvisor)</text>
  <text fill="#334155" font-size="9.5" font-weight="600" x="885" y="540">4, 7. LLM Prompt / Final Response</text>
  <text fill="#334155" font-size="9.5" font-weight="600" x="885" y="562">5, 6. Agentic Tool Execution Loop</text>
  <text fill="#dc2626" font-size="10" font-weight="700" text-anchor="middle" x="995" y="593">⚠️ LESSON TEACHING DEVICE</text>
  <text fill="#991b1b" font-size="8.5" text-anchor="middle" x="995" y="608">This module leaves the booking decision unguarded!</text>
  <text fill="#991b1b" font-size="8.5" text-anchor="middle" x="995" y="621">No validation on teams/dates. Fixed in guarded-rag.</text>
  <text fill="#2563eb" font-size="7.5" font-weight="700" text-anchor="middle" x="230" y="132">1. GET /chat</text>
  <text fill="#2563eb" font-size="7.5" font-weight="700" text-anchor="middle" x="230" y="178">8. Final Ans</text>
  <text fill="#7c3aed" font-size="7.5" font-weight="700" text-anchor="middle" x="795" y="132">4. Prompt+Tools</text>
  <text fill="#7c3aed" font-size="7.5" font-weight="700" text-anchor="middle" x="795" y="178">7. Final Ans</text>
  <text fill="#059669" font-size="7.5" font-weight="700" text-anchor="middle" x="765" y="289">2. History</text>
  <text fill="#0d9488" font-size="7.5" font-weight="700" text-anchor="middle" x="247" y="376">3. Vector</text>
  <text fill="#d97706" font-size="7.5" font-weight="700" text-anchor="middle" x="787" y="246">5. Tool Call</text>
  <text fill="#d97706" font-size="7.5" font-weight="700" text-anchor="middle" x="787" y="486">6. Result</text>
  <text fill="#b45309" font-size="12" font-weight="700" text-anchor="middle" x="600" y="698">AGENTIC RAG LESSON: Autonomous Action Execution via @Tool
    (BookingTool)
  </text>
  <text fill="#92400e" font-size="11" text-anchor="middle" x="600" y="716">The model autonomously decides whether to execute real-world side effects.
    This module leaves this unguarded to demonstrate the necessity of deterministic safety gates in guarded-rag module.
  </text>
</svg>
