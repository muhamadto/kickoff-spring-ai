  <rect fill="#ffffff" height="100" rx="6" stroke="#d8b4fe" stroke-width="1" width="230" x="525" y="530"/>
  <rect fill="#faf5ff" height="340" rx="12" stroke="#9333ea" stroke-width="2" width="350" x="820" y="75"/>
