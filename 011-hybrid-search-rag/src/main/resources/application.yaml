spring:
  application:
    name: Worldcup2026
  threads:
    virtual:
      enabled: true
  ai:
    google:
      genai:
        api-key: ${GOOGLE_AI_API_KEY}
        chat:
          model: gemini-3.1-pro-preview
          flash-model: gemini-3.5-flash
          flash-lite-model: gemini-3.1-flash-lite
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    vectorstore:
      pgvector:
        initialize-schema: true
        table-name: world_cup_knowledge
  datasource:
    url: jdbc:postgresql://localhost:5432/worldcup
    username: worldcup
    password: worldcup

worldcup:
  hybrid-search:
    full-text-column: search_vector
    full-text-index: world_cup_knowledge_search_idx
    dense-top-k: 10
    sparse-top-k: 10
    fused-top-k: 5
    reciprocal-rank-fusion-k: 60

logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG

