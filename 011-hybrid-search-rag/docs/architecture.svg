  <line marker-end="url(#arrow-green)" stroke="#059669" stroke-dasharray="4 4" stroke-width="1.5" x1="590" x2="590" y1="303" y2="440"/>

  <rect fill="#ffffff" height="16" rx="3" stroke="#2563eb" stroke-width="1" width="80" x="205" y="132"/>
  <rect fill="#ffffff" height="16" rx="3" stroke="#7c3aed" stroke-width="1" width="90" x="755" y="132"/>
  <rect fill="#ffffff" height="16" rx="3" stroke="#7c3aed" stroke-width="1" width="90" x="755" y="193"/>
  <rect fill="#ffffff" height="16" rx="3" stroke="#2563eb" stroke-width="1" width="80" x="205" y="193"/>
  <rect fill="#ffffff" height="18" rx="3" stroke="#059669" stroke-width="1" width="90" x="635" y="350"/>
  <rect fill="#ffffff" height="18" rx="3" stroke="#0d9488" stroke-width="1" width="135" x="330" y="407"/>
  <rect fill="#ffffff" height="18" rx="3" stroke="#059669" stroke-width="1" width="90" x="545" y="350"/>

  <text fill="#0f172a" font-size="20" font-weight="700" text-anchor="middle" x="600" y="35">Spring AI Hybrid Search RAG Architecture</text>
  <text fill="#64748b" font-size="13" text-anchor="middle" x="600" y="55">Focused Lesson View: Unobstructed Advisor Pipeline &amp; Clean
    Interactions
  </text>
  <text fill="#334155" font-size="14" font-weight="700" text-anchor="middle" x="125" y="112">Chat Client / HTTP</text>
  <text fill="#64748b" font-size="11" text-anchor="middle" x="125" y="128">curl / REST Client</text>
  <text fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle" x="125" y="175">Client Application</text>
  <text fill="#475569" font-size="11" font-style="italic" text-anchor="middle" x="125" y="205">GET /chat</text>
  <text fill="#1e293b" font-size="10" font-weight="600" text-anchor="middle" x="125" y="225">question="..."</text>
  <text fill="#1e293b" font-size="10" font-weight="600" text-anchor="middle" x="125" y="243">conversationId="007"</text>
  <text fill="#1e40af" font-size="15" font-weight="700" text-anchor="middle" x="530" y="112">Spring AI Application (Java)</text>
  <text fill="#1d4ed8" font-size="13" font-weight="700" text-anchor="middle" x="530" y="158">Chat Controller: GET /chat</text>
  <text fill="#475569" font-size="10" text-anchor="middle" x="530" y="180">Entry point: Orchestrates ChatClient prompt pipeline with attached
    Advisors
  </text>
  <text fill="#15803d" font-size="12" font-weight="700" text-anchor="middle" x="530" y="242">ChatClient Advisor Pipeline (Lesson Components)</text>
  <text fill="#166534" font-size="11" font-weight="700" x="295" y="274">MessageChatMemoryAdvisor</text>
  <text fill="#15803d" font-size="10" font-weight="700" text-anchor="end" x="765" y="274">Order: 20</text>
  <text fill="#4b5563" font-size="10" x="295" y="291">• Loads conversation history before call | Writes back new turn after call</text>
  <text fill="#14532d" font-size="10" font-weight="700" x="292" y="328">HybridSearchAdvisor (RAG Core)</text>
  <text fill="#15803d" font-size="9" font-weight="700" text-anchor="end" x="513" y="328">Order: 25</text>
  <text fill="#166534" font-size="9.5" x="292" y="344">• Dense: PGVector search (Top-10)</text>
  <text fill="#166534" font-size="9.5" x="292" y="360">• Sparse: tsvector keyword (Top-10)</text>
  <text fill="#047857" font-size="9.5" font-weight="600" x="292" y="377">• RRF Fusion (k=60) → Top-5 context</text>
  <text fill="#6b21a8" font-size="11" font-weight="700" text-anchor="middle" x="402" y="460">PGVector &amp; Full-Text Store</text>
  <text fill="#7e22ce" font-size="10" font-weight="600" text-anchor="middle" x="402" y="475">Table: world_cup_knowledge</text>
  <text fill="#581c87" font-size="10" x="295" y="496">• Stores document vectors (Dense)</text>
  <text fill="#581c87" font-size="10" x="295" y="514">• Generated search_vector tsvector</text>
  <text fill="#581c87" font-size="10" x="295" y="532">• GIN Index on search_vector (Sparse)</text>
  <text fill="#581c87" font-size="10" x="295" y="550">• Dual query: Cosine Sim + ts_rank</text>
  <text fill="#9333ea" font-size="9" font-style="italic" x="295" y="572">(Returns Dense &amp; Sparse Candidates)</text>
  <text fill="#6b21a8" font-size="11" font-weight="700" text-anchor="middle" x="657" y="462">JDBC Chat Memory</text>
  <text fill="#7e22ce" font-size="10" font-weight="600" text-anchor="middle" x="657" y="478">Table: spring_ai_chat_memory</text>
  <text fill="#581c87" font-size="10" x="550" y="502">• Multi-turn conversation state</text>
  <text fill="#581c87" font-size="10" x="550" y="520">• Keyed by conversationId</text>
  <text fill="#581c87" font-size="10" x="550" y="538">• Read/Write persistence</text>
  <text fill="#9333ea" font-size="9" font-style="italic" x="550" y="558">(Managed by MemoryAdvisor)</text>
  <text fill="#7e22ce" font-size="13" font-weight="700" text-anchor="middle" x="530" y="618">PostgreSQL Database Layer</text>
  <text fill="#6b21a8" font-size="15" font-weight="700" text-anchor="middle" x="1000" y="112">LLM Model</text>
  <text fill="#dc2626" font-size="10" font-weight="700" text-anchor="middle" x="1000" y="161">Native Search Grounding</text>
  <text fill="#dc2626" font-size="10" font-weight="700" text-anchor="middle" x="1000" y="174">[ DISABLED - Hybrid Grounded ]</text>
  <text fill="#581c87" font-size="11" x="850" y="210">• Receives user prompt</text>
  <text fill="#581c87" font-size="11" x="850" y="232">• Receives conversation history</text>
  <text fill="#581c87" font-size="11" x="850" y="254">• Receives fused (Dense+Sparse) chunks</text>
  <text fill="#581c87" font-size="11" x="850" y="276">• Formulates answer with high keyword precision</text>
  <text fill="#581c87" font-size="11" x="850" y="298">• Refuses hallucination if context missing</text>
  <text fill="#6b21a8" font-size="10" font-weight="700" text-anchor="middle" x="1000" y="347">⚠️ Single-pass Hybrid RAG (Zero Tool Calls)</text>
  <text fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle" x="1000" y="448">Execution Step Legend</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="479">1, 7. Client Request / Response</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="507">2. Read Chat History (JDBC)</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="535">3. Dual Retrieval (Dense+Sparse) &amp; RRF</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="563">4, 5. Fused Prompt / Grounded Answer</text>
  <text fill="#334155" font-size="10" font-weight="600" x="895" y="591">6. Save Turn to Memory (JDBC)</text>
  <text fill="#2563eb" font-size="8" font-weight="700" text-anchor="middle" x="245" y="144">1. GET /chat</text>
  <text fill="#7c3aed" font-size="8" font-weight="700" text-anchor="middle" x="800" y="144">4. Fused Prompt</text>
  <text fill="#7c3aed" font-size="8" font-weight="700" text-anchor="middle" x="800" y="205">5. Grounded Ans</text>
  <text fill="#2563eb" font-size="8" font-weight="700" text-anchor="middle" x="245" y="205">7. Final Answer</text>
  <text fill="#059669" font-size="8" font-weight="700" text-anchor="middle" x="680" y="363">2. Read History</text>
  <text fill="#0d9488" font-size="8" font-weight="700" text-anchor="middle" x="397" y="420">3. Dense + Sparse Search</text>
  <text fill="#059669" font-size="8" font-weight="700" text-anchor="middle" x="590" y="363">6. Save Turn</text>
  <text fill="#b45309" font-size="12" font-weight="700" text-anchor="middle" x="600" y="713">HYBRID SEARCH LESSON: Combining Dense Embeddings &amp;
    Sparse Keyword Matching (BM25)
  </text>
  <text fill="#92400e" font-size="11" text-anchor="middle" x="600" y="731">Dense retrieval captures conceptual meaning, while sparse tsvector search
    locks onto exact proper nouns. RRF ranks and fuses both candidate sets.
  </text>
</svg>
