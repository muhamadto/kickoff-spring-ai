  <rect fill="#dcfce7" height="83" rx="6" stroke="#22c55e" stroke-width="1.5" width="235" x="285" y="312"/>
  <rect fill="#fdf4ff" height="205" rx="8" stroke="#c084fc" stroke-width="1.5" width="520" x="270" y="425"/>
  <rect fill="#ffffff" height="155" rx="6" stroke="#d8b4fe" stroke-width="1" width="235" x="285" y="440"/>
  <rect fill="#ffffff" height="155" rx="6" stroke="#d8b4fe" stroke-width="1" width="235" x="540" y="440"/>
  <rect fill="#faf5ff" height="320" rx="12" stroke="#9333ea" stroke-width="2" width="340" x="830" y="85"/>
  <rect fill="#fef2f2" height="38" rx="6" stroke="#fca5a5" stroke-width="1" width="260" x="870" y="145"/>
