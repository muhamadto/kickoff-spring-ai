spring:
  application:
    name: Worldcup2026
  threads:
    virtual:
      enabled: true
  ai:
    google:
      genai:
        api-key: ${GOOGLE_AI_API_KEY}
        chat:
          model: gemini-3.1-pro-preview
          flash-model: gemini-3.5-flash
          flash-lite-model: gemini-3.1-flash-lite
          google-search-retrieval: false
          include-server-side-tool-invocations: false
          thinking-budget: 8192
    chat:
      client:
        tool-search-advisor:
          enabled: true
          tool-index-type: lucene # accepted values are regex, lucene and vector
          session-id-key-name: search-tool
          max-results: 5
          advisor-order: 25
    tools:
      throw-exception-on-error: true

logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
